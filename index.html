<body>
<style id="hg-css">/* Layout: a drafting-table site. Index of found objects on graph paper; each piece opens to a live demo.
   Tokens below are the Blueprint defaults; JS overrides them from the saved site settings. */
:root {
  --bg: #F2F5F8; --panel: #FFFFFF; --fg: #12203A; --muted: #5A6880;
  --accent: #2445D6; --accent2: #E8A317; --line: #D5DDE7; --on-accent: #FFFFFF;
  --danger: #C2362B; --ok: #1F8A55;
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --radius: 10px; --scale: 1; --gap: 20px; --maxw: 1120px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1626; --panel: #142036; --fg: #E6ECF5; --muted: #93A1B8;
  --accent: #7C95FF; --accent2: #F2C14E; --line: #26344E; --on-accent: #0E1626;
  --danger: #FF7B6E; --ok: #5BD394; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1626; --panel: #142036; --fg: #E6ECF5; --muted: #93A1B8;
  --accent: #7C95FF; --accent2: #F2C14E; --line: #26344E; --on-accent: #0E1626;
  --danger: #FF7B6E; --ok: #5BD394; color-scheme: dark }

:root { --grid: color-mix(in srgb, var(--line) 40%, var(--bg)); }
html { font-size: calc(16px * var(--scale)); }
body { background: var(--bg); color: var(--fg); font: 1rem/1.6 var(--font-body); }
body.pat-grid { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 28px 28px; background-attachment: fixed; }
body.pat-dots { background-image: radial-gradient(var(--grid) 1.4px, transparent 1.6px); background-size: 22px 22px; background-attachment: fixed; }
body.pat-iso { background-image: linear-gradient(30deg, transparent 49.2%, var(--grid) 49.2% 50.8%, transparent 50.8%), linear-gradient(150deg, transparent 49.2%, var(--grid) 49.2% 50.8%, transparent 50.8%), linear-gradient(90deg, transparent 49.2%, var(--grid) 49.2% 50.8%, transparent 50.8%); background-size: 40px 69.3px; background-attachment: fixed; }
body.dens-compact { --gap: 12px; }
body.dens-airy { --gap: 32px; }
body.w-narrow { --maxw: 820px; }
body.w-wide { --maxw: 1400px; }
body.nomotion *, body.nomotion *::before, body.nomotion *::after { transition: none !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

* { box-sizing: border-box; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, select, input, textarea { font: inherit; color: inherit; }
.btn { font: 600 0.875rem/1 var(--font-ui); padding: 9px 14px; border-radius: calc(var(--radius) * .7); border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 6px 10px; font-size: .8rem; }

.shell { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
.wrap { max-width: var(--maxw); margin: 0 auto; }

/* ---------- Public site ---------- */
.site-head { padding-block: 56px 28px; display: grid; gap: 14px; }
.eyebrow { font: 600 .75rem/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.site-title { font: 700 clamp(2.4rem, 7vw, 4.6rem)/.95 var(--font-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.site-title .mark { color: var(--accent); }
.site-tag { font: 500 clamp(1.1rem, 2.4vw, 1.45rem)/1.35 var(--font-display); color: var(--muted); margin: 0; max-width: 40ch; text-wrap: balance; }
.site-intro { max-width: 62ch; margin: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 8px 20px; }
.chip { font: 600 .78rem/1 var(--font-mono); padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.cards { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.cards.layout-list { grid-template-columns: 1fr; }
.cards.layout-feature > .card:first-child { grid-column: 1 / -1; }
.cards.layout-feature > .card:first-child .card-title { font-size: clamp(1.6rem, 3.6vw, 2.4rem); }
.card { position: relative; display: grid; gap: 10px; align-content: start; padding: calc(var(--gap) * .9); text-decoration: none; color: inherit; border-radius: var(--radius); background: var(--panel); min-width: 0; transition: transform .18s ease, border-color .18s ease; }
.card-outlined .card { border: 1.5px solid var(--line); }
.card-outlined .card:hover { border-color: var(--fg); }
.card-raised .card { box-shadow: 0 1px 2px rgba(10,20,40,.08), 0 8px 24px -10px rgba(10,20,40,.25); }
.card-raised .card:hover { transform: translateY(-2px); }
.card-flat .card { background: transparent; padding-inline: 0; border-top: 2px solid var(--fg); border-radius: 0; }
.cards.layout-list .card { grid-template-columns: minmax(0, 14rem) minmax(0, 1fr); column-gap: 24px; }
.cards.layout-list .card .card-meta { grid-row: span 3; }
@media (max-width: 640px) { .cards.layout-list .card { grid-template-columns: 1fr; } }
.card-meta { font: .75rem/1.4 var(--font-mono); color: var(--muted); letter-spacing: .02em; }
.card-meta b { color: var(--accent); font-weight: 600; }
.card-title { font: 700 1.45rem/1.12 var(--font-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.card-hook { margin: 0; color: var(--fg); opacity: .85; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: .7rem/1 var(--font-mono); padding: 4px 7px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
/* card pictures (SVG drawn with palette classes) */
.card-art { aspect-ratio: 16 / 10; border-radius: calc(var(--radius) * .7); overflow: hidden; background: color-mix(in srgb, var(--accent) 6%, var(--panel)); display: grid; place-items: center; }
.card-flat .card-art { background: color-mix(in srgb, var(--accent) 6%, var(--bg)); }
.card-art svg { width: 100%; height: 100%; display: block; transition: transform .5s ease; }
.card.has-art:hover .card-art svg { transform: scale(1.04); }
.card-art .st { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.card-art .sm { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; }
.card-art .sa { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.card-art .sb { fill: none; stroke: var(--accent2); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.card-art .fa { fill: var(--accent); } .card-art .fb { fill: var(--accent2); } .card-art .fm { fill: var(--muted); }
.card-art .fp { fill: var(--panel); } .card-art .fl { fill: var(--line); }
.card-art .tint { fill: color-mix(in srgb, var(--accent) 14%, transparent); }
.card-art .lbl { fill: var(--muted); font: 600 11px var(--font-mono); letter-spacing: .04em; }
.card-art .spin { transform-box: fill-box; transform-origin: center; animation: hg-spin 14s linear infinite; }
.card-art .pulse { animation: hg-pulse 2.6s ease-in-out infinite; }
@keyframes hg-spin { to { transform: rotate(360deg); } }
@keyframes hg-pulse { 50% { opacity: .35; } }
.cards.layout-list .card.has-art .card-meta { grid-row: auto; }
.cards.layout-list .card.has-art .card-art { grid-row: 1 / span 4; align-self: start; }
@media (min-width: 760px) {
  .cards.layout-feature > .card.has-art:first-child { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); column-gap: 32px; align-content: center; }
  .cards.layout-feature > .card.has-art:first-child .card-art { grid-row: 1 / span 5; }
}
/* studio: card picture */
.cover-grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 640px) { .cover-grid { grid-template-columns: 1fr; } }
.cover-mock { border: 1.5px solid var(--line); pointer-events: none; }
.cover-mock .card-title { font-size: 1.15rem; }
.empty-art { color: var(--muted); font: .8rem var(--font-mono); border: 1.5px dashed var(--line); }
.cover-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.cover-opt { display: grid; gap: 6px; padding: 8px; border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--panel); cursor: pointer; font: 600 .78rem var(--font-ui); color: var(--accent); text-align: center; }
.cover-opt:hover { border-color: var(--accent); }
.cover-opt.busy { aspect-ratio: 16 / 12; place-items: center; color: var(--muted); border-style: dashed; cursor: default; }

.empty { padding: 40px; border: 1.5px dashed var(--line); border-radius: var(--radius); text-align: center; color: var(--muted); background: var(--panel); }

.piece { display: grid; gap: 22px; padding-block: 28px; }
.back { font: 600 .85rem var(--font-ui); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; width: fit-content; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.piece-head { display: grid; gap: 12px; max-width: 70ch; }
.piece-title { font: 700 clamp(2rem, 5.4vw, 3.4rem)/1 var(--font-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.piece-hook { font: 500 clamp(1.1rem, 2.2vw, 1.35rem)/1.4 var(--font-display); color: var(--muted); margin: 0; text-wrap: balance; }
.demo-frame { border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.frame-card .demo-frame { border: 1.5px solid var(--line); box-shadow: 0 10px 30px -18px rgba(10,20,40,.35); }
.frame-bordered .demo-frame { border: 2px solid var(--fg); }
.frame-bare .demo-frame { background: transparent; }
.demo-frame iframe { width: 100%; border: 0; display: block; min-height: 240px; background: transparent; }
.story { max-width: 66ch; display: grid; gap: 14px; font-size: 1.06rem; }
.story p { margin: 0; }
.story h3 { font: 700 1.2rem var(--font-display); margin: 8px 0 0; }
.sources { max-width: 66ch; border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 6px; }
.sources ul { margin: 0; padding-left: 18px; }
.sources li { overflow-wrap: anywhere; }
.pn { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.pn button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); font: 600 .95rem var(--font-ui); text-align: left; max-width: 46%; }
.site-foot { padding-top: 48px; color: var(--muted); font: .8rem/1.5 var(--font-mono); }

/* owner pill */
.owner-pill { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; box-shadow: 0 8px 24px -8px rgba(0,0,0,.4); }

/* ---------- Studio ---------- */
body.studio { background-image: none; }
.st-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body.studio::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 16; background: var(--panel); }
.st-brand { font: 700 1.05rem var(--font-display); display: flex; gap: 8px; align-items: baseline; }
.st-brand small { font: 600 .7rem var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.st-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.st-tabs button { font: 600 .85rem var(--font-ui); padding: 8px 12px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
.st-tabs button[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.st-spacer { flex: 1; }
.st-pubstate { font: .75rem/1.3 var(--font-mono); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.st-pubstate .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.st-pubstate.dirty .dot { background: var(--accent2); }
.st-main { padding-block: 20px 60px; }
body.compact .st-main { padding-block: 12px 40px; }
.st-pieces { display: grid; grid-template-columns: minmax(0, 290px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .st-pieces { grid-template-columns: 1fr; } }
.st-list { display: grid; gap: 10px; position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 90px); overflow: auto; padding-right: 4px; }
@media (max-width: 860px) { .st-list { position: static; max-height: 46vh; } }
.st-list-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.st-search { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.st-filter { display: flex; gap: 4px; flex-wrap: wrap; }
.st-item { display: grid; gap: 3px; text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; background: var(--panel); cursor: pointer; }
body.compact .st-item { padding: 6px 10px; }
.st-item:hover { border-color: var(--line); }
.st-item[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.st-item-title { font: 600 .92rem/1.25 var(--font-ui); }
.st-item-meta { font: .7rem var(--font-mono); color: var(--muted); display: flex; gap: 8px; align-items: center; }
.status { font: 600 .65rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; padding: 3px 6px; border-radius: 4px; }
.status-idea { background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--muted); }
.status-drafting { background: color-mix(in srgb, var(--accent2) 22%, transparent); color: color-mix(in srgb, var(--accent2) 60%, var(--fg)); }
.status-ready { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.status-published { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }

.st-editor { display: grid; gap: 18px; min-width: 0; }
.sec { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; }
body.compact .sec { padding: 12px; gap: 10px; }
.sec-head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.sec-head h2 { font: 700 1.1rem var(--font-display); margin: 0; }
.sec-head p { margin: 0; color: var(--muted); font: .85rem/1.4 var(--font-ui); }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.field { display: grid; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > span { font: 600 .72rem/1.2 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field > small { color: var(--muted); font: .75rem/1.4 var(--font-ui); }
.field input[type=text], .field input[type=number], .field input[type=url], .field select, .field textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: .95rem/1.45 var(--font-ui); }
.field textarea { resize: vertical; min-height: 80px; }
.field textarea.code { font: .78rem/1.45 var(--font-mono); min-height: 260px; white-space: pre; tab-size: 2; }
.field input[type=range] { width: 100%; accent-color: var(--accent); }
.check { display: flex; gap: 8px; align-items: center; font: .9rem var(--font-ui); }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.approaches { display: flex; flex-wrap: wrap; gap: 8px; }
.appr { text-align: left; display: grid; gap: 2px; padding: 9px 12px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; max-width: 260px; }
.appr b { font: 600 .85rem var(--font-ui); }
.appr small { color: var(--muted); font: .72rem/1.35 var(--font-ui); }
.appr[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
.vtabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.vtab { font: 600 .8rem var(--font-ui); padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.vtab[aria-selected="true"] { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.vtab .star { color: var(--accent2); }
.vtab.busy { border-style: dashed; color: var(--muted); }
.preview-wrap { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; overflow-x: auto; }
.preview-box { margin: 0 auto; transition: max-width .2s ease; }
.preview-box.w-phone { max-width: 375px; }
.preview-box.w-tablet { max-width: 768px; }
.stream { font: .75rem/1.45 var(--font-mono); color: var(--muted); white-space: pre-wrap; max-height: 220px; overflow: auto; background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 10px; }
.note { font: .85rem/1.45 var(--font-ui); color: var(--muted); }
.note.err { color: var(--danger); }
.pubbar { position: sticky; bottom: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; box-shadow: 0 -6px 20px -14px rgba(0,0,0,.4); }
.pubbar .msg { flex: 1; min-width: 180px; font: .85rem/1.4 var(--font-ui); color: var(--muted); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { display: grid; gap: 6px; padding: 8px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; width: 132px; text-align: left; }
.swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.swatch .strip { display: grid; grid-template-columns: repeat(5, 1fr); height: 26px; border-radius: 6px; overflow: hidden; }
.swatch b { font: 600 .78rem var(--font-ui); }
.colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.color { display: flex; gap: 8px; align-items: center; font: .8rem var(--font-mono); }
.color input[type=color] { width: 36px; height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; }
.color button { font-size: .7rem; border: 0; background: none; color: var(--muted); cursor: pointer; text-decoration: underline; }
.appr-edit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: 8px; align-items: start; }
@media (max-width: 640px) { .appr-edit { grid-template-columns: 1fr; } }
.preview-site { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font: 600 .9rem var(--font-ui); z-index: 50; max-width: calc(100vw - 32px); }
details.adv > summary { cursor: pointer; font: 600 .85rem var(--font-ui); color: var(--accent); }

<script type="application/json" id="hg-published">{"site":{"title":"Hidden Geometry","tagline":"The invisible maths inside everyday things","intro":"I collect objects, pictures and tricks where geometry quietly does the work: a drill bit that cuts square holes, a coin with seven curved sides, a city whose bridges stumped everyone. Each one comes with something to play with.","eyebrow":"A cabinet of curiosities","footer":"Collected with curiosity. Photos, videos and ideas belong to the makers linked on each page.","palette":"graphite","overrides":{"light":{},"dark":{}},"mode":"light","fonts":{"display":"Bricolage Grotesque","body":"Source Serif 4","mono":"JetBrains Mono"},"scale":1,"radius":10,"density":"airy","width":"standard","pattern":"dots","layout":"grid","cardStyle":"flat","demoFrame":"bare","sort":"newest","motion":true,"show":{"covers":true,"foundAt":true,"tags":true,"filters":true,"sources":true,"prevNext":true,"intro":true},"labels":{"foundAt":"Found at","sources":"Where I found it","back":"All pieces","empty":"Nothing here yet. New pieces are on their way."}},"pieces":[{"id":"why-lens-hoods-are-shaped-like-petals-idea","title":"Why lens hoods are shaped like petals","foundAt":"a camera on my desk","hook":"Your camera lens hood isn't decorated with petals. It's a tube sliced by the exact shape of the light your sensor can see.","story":"Look at the front of a lens hood and you'll see scalloped edges: two long, two short, like petals. I found this on a camera sitting on my desk. It looks like design flair, but it's really geometry at work.\n\nHere's the **aha**. A rectangular sensor can't see a round circle of the world. It sees a **rectangular pyramid of light**, with its tip at the lens and its base spreading out into the scene. The pyramid is wider along the long side of the sensor and narrower along the short side. At the corners it reaches out the farthest.\n\nNow slide that pyramid inside a tube, which is what the hood is. The tube is a **cylinder**. Where the edges of the pyramid meet the cylinder wall, they mark a curve. Unroll the tube flat and that curve is the petal outline: the hood can be **longest where the light needs the least room** (the middle of the short sides) and **shortest at the corners**, where the pyramid pushes out to the wall.\n\nThat's the trick. A round hood would either block the corners of your picture or let in stray light along the edges. The petal shape shades as much as it can while staying out of the picture. The logic is invisible until you cut the cone of light with a tube, and then it's right there on the front of your lens.","tags":["objects","optics"],"sources":[{"label":"imagemaven.com lens hood photo","url":""}],"cover":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1334 862\" font-family=\"Helvetica, Arial, sans-serif\" aria-hidden=\"true\" focusable=\"false\">\n  \u003crect width=\"1334\" height=\"862\" fill=\"#f4f4f3\"/>\n\n  \u003c!-- View plane -->\n  \u003cg id=\"view-plane\">\n    \u003cpolygon points=\"912,270 1052,48 1003,552 925,862 873,862\" fill=\"#f1eadc\" stroke=\"#d4a03a\" stroke-width=\"2\" stroke-linejoin=\"round\"/>\n    \u003ctext x=\"980\" y=\"110\" font-size=\"20\" fill=\"#666\">view\u003c/text>\n  \u003c/g>\n\n  \u003c!-- Swept surface (gray) -->\n  \u003cpath id=\"surface\" d=\"M720,214 C800,280 795,410 716,480 C800,560 935,690 820,753 L564,689 C625,600 605,450 553,350 Z\" fill=\"#e5e5e5\" stroke=\"none\"/>\n  \u003cpath d=\"M720,214 C800,280 795,410 716,480 C800,560 935,690 820,753\" fill=\"none\" stroke=\"#9a94dc\" stroke-width=\"2\"/>\n\n  \u003c!-- Cylinder end (ellipse) -->\n  \u003cellipse cx=\"494\" cy=\"407\" rx=\"112\" ry=\"286\" transform=\"rotate(6 494 407)\" fill=\"#cfcbe6\" stroke=\"#9a98a8\" stroke-width=\"2\"/>\n\n  \u003c!-- Upper purple sheet -->\n  \u003cpath d=\"M550,130 L898,153 C928,145 940,150 912,166 L553,350 C600,330 615,240 550,130 Z\" fill=\"#6b63c9\" fill-opacity=\"0.22\"/>\n  \u003c!-- Lower purple sheet -->\n  \u003cpath d=\"M480,689 L820,753 C760,752 650,720 564,689 C560,694 520,695 480,689 Z\" fill=\"#6b63c9\" fill-opacity=\"0.22\"/>\n\n  \u003c!-- Thin sheet edges -->\n  \u003cg fill=\"none\" stroke=\"#6b63c9\" stroke-width=\"2\">\n    \u003cline x1=\"550\" y1=\"130\" x2=\"898\" y2=\"153\"/>\n    \u003cline x1=\"720\" y1=\"214\" x2=\"898\" y2=\"153\"/>\n    \u003cline x1=\"480\" y1=\"689\" x2=\"820\" y2=\"753\"/>\n  \u003c/g>\n\n  \u003c!-- Profile curve (thick) -->\n  \u003cpath d=\"M898,153 C925,145 942,150 908,168 L553,350 C600,460 640,620 564,689 C650,720 760,752 820,753\" fill=\"none\" stroke=\"#3d34c4\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n\n  \u003c!-- Sensor -->\n  \u003cg id=\"sensor\">\n    \u003cpolygon points=\"276,368 330,338 334,398 283,432\" fill=\"#7d7d7d\" stroke=\"#6a6a6a\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/>\n    \u003ctext x=\"262\" y=\"340\" font-size=\"20\" fill=\"#666\">sensor\u003c/text>\n  \u003c/g>\n\n  \u003c!-- Projection rays through the pinhole (365,390) -->\n  \u003cg fill=\"none\" stroke=\"#d4a03a\" stroke-width=\"2\" stroke-linecap=\"round\">\n    \u003cline x1=\"283\" y1=\"432\" x2=\"1052\" y2=\"48\"/>\n    \u003cline x1=\"334\" y1=\"398\" x2=\"912\" y2=\"270\"/>\n    \u003cline x1=\"276\" y1=\"368\" x2=\"1003\" y2=\"552\"/>\n    \u003cline x1=\"330\" y1=\"338\" x2=\"680\" y2=\"862\"/>\n  \u003c/g>\n\n  \u003c!-- Intersection points -->\n  \u003cg fill=\"#d29b35\">\n    \u003ccircle cx=\"720\" cy=\"214\" r=\"7\"/>\n    \u003ccircle cx=\"553\" cy=\"350\" r=\"7\"/>\n    \u003ccircle cx=\"716\" cy=\"480\" r=\"7\"/>\n    \u003ccircle cx=\"564\" cy=\"689\" r=\"7\"/>\n  \u003c/g>\n\u003c/svg>","demo":"\u003cdiv class=\"hgp\">\n\u003cstyle>\n.hgp{padding:16px;color:var(--fg);font-family:var(--font-body);background:var(--panel);border-radius:var(--radius);box-sizing:border-box;max-width:100%;overflow:hidden}\n.hgp *{box-sizing:border-box}\n.hgp p{margin:6px 0}\n.hgp-lead{font-family:var(--font-display);font-size:1.1em;line-height:1.3}\n.hgp canvas{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}\n.hgp-3d{cursor:grab;touch-action:none}\n.hgp-3d:active{cursor:grabbing}\n.hgp-3d:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.hgp-ctrl{display:grid;gap:10px;margin:12px 0}\n.hgp-ctrl label{display:grid;grid-template-columns:4em 1fr 6em;align-items:center;gap:8px;font-family:var(--font-ui);font-size:14px}\n.hgp input[type=range]{width:100%;accent-color:var(--accent);margin:0}\n.hgp output{font-family:var(--font-mono);font-size:13px;color:var(--muted);text-align:right}\n.hgp-un{margin-top:8px}\n.hgp h4{margin:0 0 6px;font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}\n\u003c/style>\n\n\u003cp class=\"hgp-lead\">Drag the hood to spin it. Change the lens and watch the petals reshape.\u003c/p>\n\u003ccanvas class=\"hgp-3d\" tabindex=\"0\" aria-label=\"3D lens hood with the camera's pyramid of view. Drag or use arrow keys to rotate.\">\u003c/canvas>\n\u003cp class=\"hg-caption hgp-cap3\">\u003c/p>\n\n\u003cdiv class=\"hgp-ctrl\">\n  \u003clabel>Lens \u003cinput type=\"range\" class=\"hgp-f\" min=\"16\" max=\"70\" step=\"1\" value=\"24\">\u003coutput class=\"hgp-fo\">24 mm\u003c/output>\u003c/label>\n\u003c/div>\n\n\u003cdiv class=\"hgp-un\">\n  \u003ch4>Hood unrolled\u003c/h4>\n  \u003ccanvas class=\"hgp-unroll\" aria-label=\"Hood edge height around the rim\">\u003c/canvas>\n  \u003cp class=\"hg-caption hgp-capu\">\u003c/p>\n\u003c/div>\n\u003cp class=\"hg-caption\">Model: 3:2 frame, light passes through one point just behind the hood (a pinhole). Lens in 35 mm-film terms.\u003c/p>\n\n\u003cscript>\n(function(){\nconst root=document.querySelector('.hgp:not([data-on])');if(!root)return;root.dataset.on='1';\nconst $=s=>root.querySelector(s);\nconst cv=$('.hgp-3d'),cu=$('.hgp-unroll');\nconst R=1,D=0.6,LMAX=1.5,DIAG=43.27,PI=Math.PI,ar=1.5;\nlet f=24,yaw=0.9,pitch=-0.38,touched=false;\nconst yaw0=yaw;\nconst reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;\n\nfunction tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}\nfunction rgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16)||0);}\nfunction rgba(h,a){const c=rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}\nfunction fov(){const hh=DIAG/Math.hypot(ar,1)/2,ww=hh*ar;return {tx:ww/f,ty:hh/f};}\n// how tall the hood may be at angle p before it touches the picture's edge\nfunction natural(p,tx,ty){return R*Math.max(Math.abs(Math.cos(p))/tx,Math.abs(Math.sin(p))/ty)-D;}\nfunction hood(p,tx,ty){return Math.max(0,Math.min(LMAX,natural(p,tx,ty)));}\nfunction fit(c,ratio){\n  const w=c.clientWidth||300,h=Math.round(w*ratio),d=window.devicePixelRatio||1;\n  if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d);}\n  const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return {w,h,x};\n}\n\nfunction draw3d(){\n  const {w,h,x}=fit(cv,0.62);\n  const fg=tok('--fg'),ac=tok('--accent'),ac2=tok('--accent2'),mu=tok('--muted'),fu=tok('--font-ui');\n  x.clearRect(0,0,w,h);\n  const {tx,ty}=fov();\n  const cY=Math.cos(yaw),sY=Math.sin(yaw),cP=Math.cos(pitch),sP=Math.sin(pitch);\n  const sc=Math.min(w,h*1.6)*0.21;\n  const P=(X,Y,Z)=>{Z-=0.55;const x1=X*cY+Z*sY,z1=-X*sY+Z*cY,y2=Y*cP-z1*sP,z2=Y*sP+z1*cP,k=sc*5/(5+z2);return [w/2+x1*k,h*0.5-y2*k];};\n  const Lw=t=>hood(t,tx,ty);\n  const del=Math.atan2(-sY*cP,sP);\n  const surf=(t0,fill)=>{\n    x.beginPath();\n    for(let i=0;i\u003c=72;i++){const t=t0+PI*i/72,p=P(R*Math.cos(t),R*Math.sin(t),Lw(t));i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);}\n    for(let i=72;i>=0;i--){const t=t0+PI*i/72,p=P(R*Math.cos(t),R*Math.sin(t),0);x.lineTo(p[0],p[1]);}\n    x.closePath();x.fillStyle=fill;x.fill();\n  };\n  const edge=(t0,col,lw)=>{\n    x.beginPath();\n    for(let i=0;i\u003c=72;i++){const t=t0+PI*i/72,p=P(R*Math.cos(t),R*Math.sin(t),Lw(t));i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);}\n    x.strokeStyle=col;x.lineWidth=lw;x.stroke();\n  };\n  const ring=(col)=>{x.beginPath();for(let i=0;i\u003c=96;i++){const t=2*PI*i/96,p=P(R*Math.cos(t),R*Math.sin(t),0);i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);}x.strokeStyle=col;x.lineWidth=1.2;x.stroke();};\n  const bk=-del,fr=PI-del;\n  // back (inside) of hood\n  surf(bk,rgba(fg,0.07));edge(bk,rgba(ac,0.45),1.2);ring(rgba(fg,0.35));\n  // pyramid of light\n  const C=[[1,1],[-1,1],[-1,-1],[1,-1]];\n  const sEnd=Math.min(2.6,2.0/Math.hypot(tx,ty)),s0=-0.25;\n  const pt=(c,s)=>P(c[0]*tx*s,c[1]*ty*s,s-D);\n  x.beginPath();C.forEach((c,i)=>{const p=pt(c,s0);i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);});x.closePath();\n  x.fillStyle=rgba(fg,0.55);x.fill();\n  x.beginPath();C.forEach((c,i)=>{const p=pt(c,sEnd);i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);});x.closePath();\n  x.fillStyle=rgba(ac2,0.1);x.fill();x.strokeStyle=ac2;x.lineWidth=1.2;x.stroke();\n  C.forEach(c=>{const a=pt(c,s0),b=pt(c,sEnd);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.strokeStyle=ac2;x.lineWidth=1.3;x.stroke();});\n  // front (outside) of hood\n  surf(fr,rgba(ac,0.22));\n  const s1=P(R*Math.cos(fr),R*Math.sin(fr),0),s2=P(R*Math.cos(fr),R*Math.sin(fr),Lw(fr));\n  const s3=P(R*Math.cos(fr+PI),R*Math.sin(fr+PI),0),s4=P(R*Math.cos(fr+PI),R*Math.sin(fr+PI),Lw(fr+PI));\n  x.beginPath();x.moveTo(s1[0],s1[1]);x.lineTo(s2[0],s2[1]);x.moveTo(s3[0],s3[1]);x.lineTo(s4[0],s4[1]);x.strokeStyle=rgba(ac,0.7);x.lineWidth=1.2;x.stroke();\n  edge(fr,ac,2.2);\n  // where the corner rays graze the tube\n  const sh=R/Math.hypot(tx,ty),zh=sh-D;\n  if(zh\u003c=LMAX){C.forEach(c=>{\n    const p=pt(c,sh);x.beginPath();x.arc(p[0],p[1],4,0,2*PI);x.fillStyle=ac2;x.fill();\n  });}\n  x.font='12px '+fu;x.fillStyle=mu;x.textAlign='center';\n  const ls=pt([0,-1.6],s0);x.fillText('sensor',ls[0],ls[1]+4);\n  const lf=pt([0,1],sEnd);x.fillText('view',lf[0],Math.max(12,lf[1]-6));\n}\n\nfunction drawUnroll(){\n  const {w,h,x}=fit(cu,0.4);\n  const fg=tok('--fg'),ac=tok('--accent'),ac2=tok('--accent2'),mu=tok('--muted'),fu=tok('--font-ui');\n  x.clearRect(0,0,w,h);\n  const {tx,ty}=fov(),top=10,bot=20,pl=6,pw=w-12,ph=h-top-bot,TOPV=LMAX*1.1;\n  const X=d=>pl+d/360*pw,Y=L=>top+ph-Math.min(L,TOPV)/TOPV*ph,rad=d=>d*PI/180;\n  x.beginPath();x.moveTo(X(0),Y(0));\n  for(let d=0;d\u003c=360;d+=1)x.lineTo(X(d),Y(hood(rad(d),tx,ty)));\n  x.lineTo(X(360),Y(0));x.closePath();x.fillStyle=rgba(ac,0.25);x.fill();x.strokeStyle=ac;x.lineWidth=1.8;x.stroke();\n  x.setLineDash([4,3]);x.beginPath();\n  for(let d=0;d\u003c=360;d+=1){const p=[X(d),Y(Math.max(0,natural(rad(d),tx,ty)))];d?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);}\n  x.strokeStyle=rgba(fg,0.55);x.lineWidth=1;x.stroke();\n  const tc=Math.atan2(ty,tx)*180/PI;\n  x.strokeStyle=ac2;x.lineWidth=1.3;\n  [tc,180-tc,180+tc,360-tc].forEach(d=>{x.beginPath();x.moveTo(X(d),top);x.lineTo(X(d),top+ph);x.stroke();});\n  x.setLineDash([]);\n  x.font='11px '+fu;x.fillStyle=mu;\n  [[0,'side','left'],[90,'top','center'],[180,'side','center'],[270,'bottom','center'],[360,'side','right']].forEach(a=>{x.textAlign=a[2];x.fillText(a[1],X(a[0]),h-6);});\n}\n\nfunction update(){\n  draw3d();drawUnroll();\n  const {tx,ty}=fov(),lc=R/Math.hypot(tx,ty)-D;\n  let t,u;\n  if(lc>=LMAX-0.01){\n    t='At '+f+' mm the view is narrow, so a plain tube clears every corner. No petals needed.';\n    u='Flat edge: the hood stays below the limit all the way round.';\n  }else{\n    t='Corner rays splay out furthest, so the hood dips there (dots). The frame is shortest top-to-bottom, so those petals are tallest.';\n    u='Dashed = how high the hood may go. Lines = frame corners, where it must dip. Wider lens, deeper dips.';\n  }\n  $('.hgp-cap3').textContent=t;\n  $('.hgp-capu').textContent=u;\n  $('.hgp-fo').textContent=f+' mm '+(f\u003c35?'wide':f\u003c55?'normal':'tele');\n}\n\n$('.hgp-f').addEventListener('input',e=>{f=+e.target.value;update();});\n\nlet drag=null;\nconst clampP=p=>Math.max(-1.3,Math.min(1.3,p));\ncv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];touched=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}});\ncv.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*0.012;pitch=clampP(pitch-(e.clientY-drag[1])*0.012);drag=[e.clientX,e.clientY];draw3d();});\n['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{drag=null;}));\ncv.addEventListener('keydown',e=>{\n  const k={ArrowLeft:[0.12,0],ArrowRight:[-0.12,0],ArrowUp:[0,-0.1],ArrowDown:[0,0.1]}[e.key];\n  if(!k)return;e.preventDefault();touched=true;yaw+=k[0];pitch=clampP(pitch+k[1]);draw3d();});\n\nif(window.ResizeObserver)new ResizeObserver(()=>update()).observe(root);else window.addEventListener('resize',update);\nupdate();\n\nif(!reduce){\n  const t0=performance.now();\n  const loop=now=>{if(touched||!root.isConnected)return;yaw=yaw0+0.35*Math.sin((now-t0)/2600);draw3d();requestAnimationFrame(loop);};\n  requestAnimationFrame(loop);\n}\n})();\n\u003c/script>\n\u003c/div>","date":1795107411286,"order":10},{"id":"cicadas-and-prime-numbers-idea","title":"Cicadas and prime numbers","foundAt":"a YouTube video","hook":"Why do some cicadas wait exactly 13 or 17 years underground? Their calendar may be a clever piece of prime-number defence.","story":"Periodical cicadas spend years underground, then all emerge together. In North America, the cycles are **13 or 17 years**, both prime numbers. We found this idea in a YouTube video called \"Cicada's love for prime numbers\", and it's one you can test yourself.\n\nHere is the picture to draw. Make a 100-year timeline. Mark a dot every time the cicadas emerge. Now mark a different colour of dot for a predator that peaks every 2, 3, 4, 5 or 6 years. Wherever the dots land in the same year, that's a **clash**: a feast for the predator.\n\nA cycle clashes with another whenever the years share a factor. A 12-year cicada meets a 2, 3, 4 or 6-year predator again and again, because 12 divides evenly by all of them. A 15-year cicada clashes with 3 and 5-year predators. Even a 9-year cycle meets 3-year predators every time. An odd number isn't safe if it has small factors. A prime has none to share, so a 13 or 17-year cicada only meets a predator every **cycle × predator** years. A 13-year cicada and a 4-year predator meet just once in 52 years.\n\nTo see it, build a simple tool: pick a cicada cycle from 5 to 20, pick a predator cycle from 2 to 6, and count the clashes in 100 years. Try 12, 14, 15 and 16, then 13 and 17. The primes will show the fewest clashes. Note that 7 and 11 are prime too, so they also do well, but the longer cycles of 13 and 17 give predators fewer chances still. This is a neat explanation rather than a proven one, but the patterns in the numbers are real.","tags":["nature","numbers"],"sources":[{"label":"Cicada's love for prime numbers","url":"https://www.youtube.com/watch?v=nyLyvpn4ojs&t=17s"}],"cover":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 200\" aria-hidden=\"true\" focusable=\"false\">\u003cpath class=\"sm\" d=\"M36 40 H296\" opacity=\".6\"/>\u003ctext class=\"lbl\" x=\"6\" y=\"30\">you 13\u003c/text>\u003ccircle class=\"fa\" cx=\"69.8\" cy=\"40\" r=\"6\"/>\u003ccircle class=\"fa\" cx=\"103.6\" cy=\"40\" r=\"6\"/>\u003ccircle class=\"fa\" cx=\"137.4\" cy=\"40\" r=\"6\"/>\u003ccircle class=\"fa\" cx=\"171.2\" cy=\"40\" r=\"6\"/>\u003ccircle class=\"fa\" cx=\"205\" cy=\"40\" r=\"6\"/>\u003ccircle class=\"fa\" cx=\"238.8\" cy=\"40\" r=\"6\"/>\u003ccircle class=\"fa\" cx=\"272.6\" cy=\"40\" r=\"6\"/>\u003cpath class=\"sm\" d=\"M36 100 H296\" opacity=\".6\"/>\u003ctext class=\"lbl\" x=\"6\" y=\"90\">pred 4\u003c/text>\u003ccircle class=\"fm\" cx=\"46.4\" cy=\"100\" r=\"2.6\"/>\u003ccircle class=\"fm\" cx=\"56.8\" cy=\"100\" r=\"2.6\"/>\u003ccircle class=\"fm\" cx=\"67.2\" cy=\"100\" r=\"2.6\"/>\u003ccircle class=\"fm\" cx=\"77. 150\" r=\"2.6\"/>\u003ccircle class=\"fm\" cx=\"207.6\" cy=\"150\" r=\"2.6\"/>\u003ccircle class=\"fm\" cx=\"223.2\" cy=\"150\" r=\"2.6\"/>\u003ccircle class=\"fm\" cx=\"238.8\" cy=\"150\" r=\"2.6\"/>\u003ccircle class=\"fm\" cx=\"254.4\" cy=\"150\" r=\"2.6\"/>\u003ccircle class=\"fm\" cx=\"270\" cy=\"150\" r=\"2.6\"/>\u003ccircle class=\"fm\" cx=\"285.6\" cy=\"150\" r=\"2.6\"/>\u003cpath class=\"sb\" d=\"M171.2 40 V100\" stroke-dasharray=\"3 4\" stroke-width=\"1.6\"/>\u003ccircle class=\"sb\" cx=\"171.2\" cy=\"40\" r=\"10\"/>\u003ccircle class=\"sb\" cx=\"171.2\" cy=\"100\" r=\"8\"/>\u003cpath class=\"sb\" d=\"M238.8 40 V150\" stroke-dasharray=\"3 4\" stroke-width=\"1.6\"/>\u003ccircle class=\"sb\" cx=\"238.8\" cy=\"40\" r=\"10\"/>\u003ccircle class=\"sb\" cx=\"238.8\" cy=\"150\" r=\"8\"/>\u003ctext class=\"lbl\" x=\"296\" y=\"190\" text-anchor=\"end\">only 2 clashes in 100 years\u003c/text>\u003c/svg>","demo":"\u003cdiv class=\"hgc-cicada\">\n\u003cstyle>\n.hgc-cicada{padding:16px;font-family:var(--font-body);color:var(--fg);background:var(--panel);border-radius:var(--radius);box-sizing:border-box;max-width:100%;overflow:hidden}\n.hgc-cicada *{box-sizing:border-box}\n.hgc-cicada h3{font-family:var(--font-display);margin:0 0 6px;font-size:1.45rem;line-height:1.2}\n.hgc-cicada p{margin:0 0 10px;line-height:1.45}\n.hgc-cicada .goal{color:var(--muted)}\n.hgc-cicada .goal strong{color:var(--fg)}\n.hgc-cicada .ctl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:10px 0 4px}\n.hgc-cicada .big{font-family:var(--font-display);font-size:2.4rem;line-height:1;min-width:2.2ch;color:var(--accent)}\n.hgc-cicada .ctl label{font-family:var(--font-ui);font-size:.85rem;color:var(--muted)}\n.hgc-cicada .sl{position:relative;margin:0 0 10px}\n.hgc-cicada .rail{position:absolute;left:0;right:0;top:0;height:28px;pointer-events:none}\n.hgc-cicada .trk{position:absolute;left:11px;right:11px;top:12px;height:4px;background:var(--line);border-radius:2px}\n.hgc-cicada .dot{position:absolute;top:14px;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--muted)}\n.hgc-cicada .dot.on{background:var(--accent)}\n.hgc-cicada input[type=range]{-webkit-appearance:none;appearance:none;position:relative;z-index:1;display:block;width:100%;height:28px;margin:0;padding:0;background:transparent;cursor:pointer}\n.hgc-cicada input[type=range]:focus{outline:none}\n.hgc-cicada input[type=range]:focus-visible{outline:2px solid var(--accent2);outline-offset:3px;border-radius:4px}\n.hgc-cicada input[type=range]::-webkit-slider-runnable-track{height:4px;background:transparent;border:0}\n.hgc-cicada input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--accent)}\n.hgc-cicada input[type=range]::-moz-range-track{height:4px;background:transparent;border:0}\n.hgc-cicada input[type=range]::-moz-range-thumb{box-sizing:border-box;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--accent)}\n.hgc-cicada .ticks{position:relative;height:20px;margin-top:2px}\n.hgc-cicada .tick{position:absolute;top:0;transform:translateX(-50%);font-family:var(--font-mono);font-size:11px;color:var(--muted);cursor:pointer;user-select:none;padding:0 1px;line-height:20px}\n.hgc-cicada .tick.on{color:var(--accent);font-weight:700}\n.hgc-cicada.narrow .tick.ev:not(.on){display:none}\n.hgc-cicada .preds{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px;font-family:var(--font-ui);font-size:.85rem;color:var(--muted)}\n.hgc-cicada svg{width:100%;height:auto;display:block}\n.hgc-cicada .lbl{font-family:var(--font-ui);font-size:12px;fill:var(--muted)}\n.hgc-cicada .lbl.you{fill:var(--accent);font-weight:700}\n.hgc-cicada .track{stroke:var(--line);stroke-width:1}\n.hgc-cicada .dotP{fill:var(--muted)}\n.hgc-cicada .dotC{fill:var(--accent)}\n.hgc-cicada .ring{fill:none;stroke:var(--accent2);stroke-width:2.5}\n.hgc-cicada .vline{stroke:var(--accent2);stroke-width:1.5;stroke-dasharray:3 2}\n.hgc-cicada .cur{stroke:var(--fg);stroke-width:1;opacity:.35}\n.hgc-cicada .cnt{font-family:var(--font-mono);font-size:13px;fill:var(--muted)}\n.hgc-cicada .cnt.hot{fill:var(--accent2);font-weight:700}\n.hgc-cicada .score{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-family:var(--font-ui);margin:8px 0 4px}\n.hgc-cicada .score b{font-family:var(--font-display);font-size:2rem;color:var(--accent2);line-height:1}\n.hgc-cicada .verdict{font-weight:700}\n.hgc-cicada .verdict.win{color:var(--accent)}\n.hgc-cicada .hg-caption{min-height:3em;margin:4px 0 12px}\n.hgc-cicada .reveal{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}\n.hgc-cicada .reveal[hidden]{display:none}\n.hgc-cicada .bar{fill:var(--line)}\n.hgc-cicada .bar.prime{fill:var(--accent2)}\n.hgc-cicada .bar.sel{stroke:var(--fg);stroke-width:2}\n.hgc-cicada .bsvg g{cursor:pointer}\n.hgc-cicada .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}\n.hgc-cicada .chip{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:3px 9px}\n.hgc-cicada .chip.bad{border-color:var(--accent2);color:var(--accent2)}\n.hgc-cicada .key{font-family:var(--font-ui);font-size:.8rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin:4px 0}\n.hgc-cicada .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}\n\u003c/style>\n\n\u003ch3>Be the cicada: dodge the predators\u003c/h3>\n\u003cp class=\"goal\">Predators boom every 2–6 years. You sleep underground for 8–25 years, then all pop out together. Pick your cycle so you meet predators as rarely as possible in 100 years. \u003cstrong class=\"target\">\u003c/strong>\u003c/p>\n\n\u003cdiv class=\"ctl\">\n  \u003cspan class=\"big cval\">12\u003c/span>\n  \u003clabel for=\"hgcC\">years underground\u003c/label>\n\u003c/div>\n\u003cdiv class=\"sl\">\n  \u003cdiv class=\"rail\" aria-hidden=\"true\">\u003ci class=\"trk\">\u003c/i>\u003cspan class=\"dots\">\u003c/span>\u003c/div>\n  \u003cinput id=\"hgcC\" class=\"cin\" type=\"range\" min=\"8\" max=\"25\" step=\"1\" value=\"12\" aria-label=\"Cicada cycle in years\">\n  \u003cdiv class=\"ticks\" aria-hidden=\"true\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"preds\">Predator cycles:\n  \u003cdiv class=\"hg-seg pseg\" role=\"group\" aria-label=\"Predator cycles\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tl\">\u003csvg class=\"tsvg\" role=\"img\" aria-label=\"100-year timeline of cicada and predator emergences\">\u003c/svg>\u003c/div>\n\n\u003cdiv class=\"score\">\u003cspan>Clashes in 100 years:\u003c/span>\u003cb class=\"tot\">0\u003c/b>\u003cspan class=\"verdict\">\u003c/span>\u003c/div>\n\u003cp class=\"hg-caption cap\">\u003c/p>\n\n\u003cdiv class=\"hg-row\">\u003cbutton class=\"hg-primary rbtn\" type=\"button\" aria-expanded=\"false\">Reveal the trick\u003c/button>\u003c/div>\n\n\u003cdiv class=\"reveal\" hidden>\n  \u003cp>\u003cstrong>Two cycles meet at the first year both fit into.\u003c/strong> If they share a factor, that comes early. A prime shares no factor with 2–6, so the first meeting is cicada × predator years away.\u003c/p>\n  \u003cdiv class=\"chips mchips\">\u003c/div>\n  \u003csvg class=\"bsvg\" role=\"img\" aria-label=\"Clashes for every cycle from 8 to 25 years\">\u003c/svg>\n  \u003cdiv class=\"key\">\u003cspan>\u003ci class=\"sw\" style=\"background:var(--accent2)\">\u003c/i>prime\u003c/span>\u003cspan>\u003ci class=\"sw\" style=\"background:var(--line)\">\u003c/i>not prime\u003c/span>\u003cspan>Tap a bar to try it\u003c/span>\u003c/div>\n  \u003cp class=\"hg-caption bcap\">\u003c/p>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  var all=document.querySelectorAll('.hgc-cicada'),R=all[all.length-1];\n  if(!R)return;\n  var $=function(s){return R.querySelector(s)};\n  var NS='http://www.w3.org/2000/svg',YRS=100,MIN=8,MAX=25;\n  var st={c:12,p:{2:1,3:1,4:1,5:1,6:1}},raf=0;\n  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  function gcd(a,b){return b?gcd(b,a%b):a}\n  function lcm(a,b){return a/gcd(a,b)*b}\n  function isPrime(n){if(n\u003c2)return false;for(var i=2;i*i\u003c=n;i++)if(n%i===0)return false;return true}\n  function factor(n){var f=[],d=2;while(n>1){while(n%d===0){f.push(d);n/=d}d++}return f.join('×')}\n  function act(){return [2,3,4,5,6].filter(function(p){return st.p[p]})}\n  function clash(c,p){return Math.floor(YRS/lcm(c,p))}\n  function total(c){return act().reduce(function(s,p){return s+clash(c,p)},0)}\n  function best(){var m=1e9;for(var c=MIN;c\u003c=MAX;c++)m=Math.min(m,total(c));return m}\n  function bestCycles(){var m=best(),r=[];for(var c=MIN;c\u003c=MAX;c++)if(total(c)===m)r.push(c);return r}\n\n  function setNarrow(){R.classList.toggle('narrow',R.clientWidth\u003c560)}\n  setNarrow();\n\n  // slider dots + year numbers, placed exactly where the thumb can stop\n  var dotsEl=$('.dots'),ticksEl=$('.ticks'),dots=[],ticks=[];\n  for(var v=MIN;v\u003c=MAX;v++){\n    var k=(v-MIN)/(MAX-MIN),pos='calc(11px + (100% - 22px) * '+k+')';\n    var d=document.createElement('i');d.className='dot';d.style.left=pos;dotsEl.appendChild(d);dots.push(d);\n    var t=document.createElement('span');t.style.left=pos;t.textContent=v;\n    (function(val){t.addEventListener('click',function(){setC(val)})})(v);\n    ticksEl.appendChild(t);ticks.push(t);\n  }\n  function markSlider(){\n    for(var i=0;i\u003cdots.length;i++){\n      var val=MIN+i;\n      dots[i].className='dot'+(val\u003c=st.c?' on':'');\n      ticks[i].className='tick'+(val%2?'':' ev')+(val===st.c?' on':'');\n    }\n  }\n\n  // predator toggle buttons\n  var seg=$('.pseg');\n  [2,3,4,5,6].forEach(function(p){\n    var b=document.createElement('button');b.type='button';b.textContent=p+'y';\n    b.setAttribute('aria- 'end','class':'cnt'},'0');\n      tsvg.appendChild(ct);rowCnt.push([p,m,ct]);\n    });\n    for(var t=c;t\u003c=YRS;t+=c){var d=el('circle',{cx:x(t),cy:y0,r:5,'class':'dotC'});tsvg.appendChild(d);anim.push([t,d])}\n    cursor=el('line',{x1:L,x2:L,y1:top,y2:H-18,'class':'cur'});tsvg.appendChild(cursor);\n\n    function frame(T){\n      anim.forEach(function(a){a[1].style.opacity=a[0]\u003c=T?1:0});\n      var sum=0;\n      rowCnt.forEach(function(r){var n=Math.floor(T/r[1]);sum+=n;r[2].textContent=n;r[2].setAttribute('class','cnt'+(n?' hot':''))});\n      $('.tot').textContent=sum;\n      cursor.setAttribute('x1',x(T));cursor.setAttribute('x2',x(T));\n      cursor.style.opacity=T>=YRS?0:'';\n    }\n    if(!animate||reduce){frame(YRS);return}\n    var s0=performance.now(),D=1300;\n    frame(0);\n    function step(ts){var k=Math.min(1,Math.max(0,(ts-s0)/D));frame(Math.floor(k*YRS));if(k\u003c1)raf=requestAnimationFrame(step)}\n    raf=requestAnimationFrame(step);\n  }\n\n  function caption(){\n    var c=st.c,ps=act();\n    if(!ps.length)return 'No predators switched on. Turn some back on to see the danger.';\n    var worst=ps.slice().sort(function(a,b){return clash(c,b)-clash(c,a)})[0];\n    if(isPrime(c))return c+' is prime: it can’t be split into equal smaller chunks. So a '+worst+'-year predator only lines up with you every '+c+'×'+worst+' = '+(c*worst)+' years.';\n    var divs=ps.filter(function(p){return c%p===0});\n    var odd=c%2?' Being odd doesn’t save you: what matters is having no small factors.':'';\n    if(divs.length)return c+' = '+factor(c)+'. Predators on '+divs.join(', ')+' years fit neatly into '+c+', so they meet you every '+c+' years.'+odd;\n    var sh=ps.filter(function(p){return gcd(c,p)>1})[0];\n    if(sh)return c+' = '+factor(c)+' shares a factor with '+sh+', so you meet every '+lcm(c,sh)+' years, not '+(c*sh)+'.'+odd;\n    return c+' = '+factor(c)+' shares no factor with these predators, so meetings are rare.';\n  }\n\n  var bsvg=$('.bsvg');\n  function drawBars(){\n    var W=Math.max(300,$('.reveal').clientWidth||600),H=170,ps=act();\n    bsvg.setAttribute('viewBox','0 0 '+W+' '+H);\n    while(bsvg.firstChild)bsvg.removeChild(bsvg.firstChild);\n    var n=MAX-MIN+1,mx=1,vals=[];\n    for(var c=MIN;c\u003c=MAX;c++){var v=total(c);vals.push(v);mx=Math.max(mx,v)}\n    var bw=W/n,base=H-20,hmax=H-44,fs=bw\u003c28?'10px':'';\n    vals.forEach(function(v,i){\n      var c=MIN+i,h=v/mx*hmax,g=el('g',{'data-c':c});\n      g.appendChild(el('rect',{x:i*bw+bw*.15,y:base-h,width:bw*.7,height:Math.max(h,1),rx:2,'class':'bar'+(isPrime(c)?' prime':'')+(c===st.c?' sel':'')}));\n      var t1=el('text',{x:i*bw+bw/2,y:base-h-5,'text-anchor':'middle','class':'cnt'+(c===st.c?' hot':'')},v);\n      var t2=el('text',{x:i*bw+bw/2,y:H-4,'text-anchor':'middle','class':'lbl'+(c===st.c?' you':'')},c);\n      if(fs){t1.style.fontSize=fs;t2.style.fontSize=fs}\n      g.appendChild(t1);g.appendChild(t2);\n      g.appendChild(el('title',{},c+' years: '+v+' clashes'));\n      g.addEventListener('click',function(){setC(c)});\n      bsvg.appendChild(g);\n    });\n    var mc=$('.mchips');mc.textContent='';\n    ps.forEach(function(p){\n      var s=document.createElement('span'),m=lcm(st.c,p);\n      s.className='chip'+(m\u003cst.c*p?' bad':'');\n      s.textContent=st.c+' & '+p+'y: meet every '+m+' yrs';\n      mc.appendChild(s);\n    });\n    var bc=$('.bcap');\n    if(!ps.length){bc.textContent='Switch on some predators to compare cycles.';return}\n    var bs=bestCycles();\n    bc.textContent='Primes 11, 13, 17, 19 and 23 dip low. 9, 15, 21 and 25 are odd but split into 3s and 5s, so they still get caught. Here '+bs.join(' and ')+' do'+(bs.length===1?'es':'')+' best. Longer primes are safer, but years underground are risky too, and real cicadas settled on 13 and 17. (A leading explanation, not proven fact.)';\n  }\n\n  function setC(c){st.c=c;$('.cin').value=c;update(true)}\n\n  function update(animate){\n    var c=st.c,ps=act();\n    $('.c rid of dots gets three times finer, sideways only.\n\nThe maths is simple counting. Tiny letters are drawn on a grid of on/off cells. Here, the cells are the sub-pixels, so turning on just the red bar gives a red sliver, green and blue together give cyan, and so on. Each letter becomes a tiny pattern of coloured stripes that your eye stitches back into a shape.\n\nThe catch is that it only works when the sub-pixels sit in the expected order (red, green, blue, left to right) on a standard LCD. Rotate the screen or use a different panel layout and the letters smear into colour fringes. The hidden geometry here is the screen itself: a grid inside a grid.","tags":["numbers","screens"],"sources":[{"label":"Millitext","url":"https://www.msarnoff.org/millitext/"}],"cover":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 200\" aria-hidden=\"true\" focusable=\"false\">\n\u003crect x=\"70\" y=\"30\" width=\"180\" height=\"140\" rx=\"8\" class=\"fp st\" stroke-width=\"1.5\"/>\n\u003crect x=\"80\" y=\"40\" width=\"160\" height=\"120\" class=\"tint\"/>\n\u003cg>\n\u003crect x=\"125\" y=\"55\" width=\"10\" height=\"90\" class=\"fa\"/>\n\u003crect x=\"135\" y=\"55\" width=\"10\" height=\"90\" class=\"fb\"/>\n\u003crect x=\"145\" y=\"55\" width=\"10\" height=\"90\" class=\"fm\"/>\n\u003crect x=\"165\" y=\"55\" width=\"10\" height=\"90\" class=\"fa\"/>\n\u003crect x=\"175\" y=\"55\" width=\"10\" height=\"90\" class=\"fb\"/>\n\u003crect x=\"185\" y=\"55\" width=\"10\" height=\"90\" class=\"fm\"/>\n\u003c/g>\n\u003cg class=\"fp\">\n\u003crect x=\"125\" y=\"55\" width=\"30\" height=\"14\"/>\n\u003crect x=\"125\" y=\"83\" width=\"10\" height=\"14\"/>\n\u003crect x=\"145\" y=\"83\" width=\"10\" height=\"14\"/>\n\u003crect x=\"135\" y=\"111\" width=\"10\" height=\"14\"/>\n\u003crect x=\"125\" y=\"131\" width=\"30\" height=\"14\"/>\n\u003crect x=\"165\" y=\"55\" width=\"10\" height=\"14\"/>\n\u003crect x=\"185\" y=\"55\" width=\"10\" height=\"14\"/>\n\u003crect x=\"175\" y
