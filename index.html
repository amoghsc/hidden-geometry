 function rgb(d){ return 'rgb('+(d&4?255:0)+','+(d&2?255:0)+','+(d&1?255:0)+')'; }\n\n  function sizes(){\n    var smax=Math.max(10,(H-34)/5), smin=2;\n    var v=zoom.value/1000, s=smin*Math.pow(smax/smin,v);\n    var u=Math.min(1,Math.max(0,(s-5)/(22-5))); var t=u*u*(3-2*u);\n    return {s:s,t:t};\n  }\n\n  function layout(){\n    var r=cv.getBoundingClientRect(); var nw=Math.max(280,Math.round(r.width||root.clientWidth-32));\n    dpr=window.devicePixelRatio||1; W=nw; H=Math.round(Math.min(260,Math.max(150,W*0.42)));\n    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);\n    draw();\n  }\n\n  function geom(){\n    var z=sizes(), cs=chars(), n=cs.length*2-1, total=n*z.s, x0;\n    if(total\u003c=W-24) x0=(W-total)/2;\n    else { x0=W/2-cx*total; x0=Math.min(12,Math.max(W-12-total,x0)); }\n    var y0=(H-5*z.s-(z.t>0.5?16:0))/2;\n    return {s:z.s,t:z.t,cs:cs,n:n,x0:x0,y0:y0,total:total};\n  }\n\n  function draw(){\n    var g=geom(), s=g.s, t=g.t;\n    ctx.setTransform(dpr,0,0,dpr,0,0);\n    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); // a switched-off screen is black\n    for(var j=0;j\u003cg.n;j++){\n      var px=g.x0+j*s; if(px+s\u003c0||px>W) continue;\n      var ci=(j%2===0)?j/2:-1, gl=ci>=0?glyph(g.cs[ci]):\"00000\";\n      for(var r=0;r\u003c5;r++){\n        var d=parseInt(gl[r],10), y=g.y0+r*s;\n        if(t\u003c0.01){ ctx.fillStyle=rgb(d); ctx.fillRect(px,y,s,s); continue; }\n        var gx=t*s/3*0.16, gy=t*s*0.06;\n        for(var k=0;k\u003c3;k++){\n          var C=[d&4?255:0,d&2?255:0,d&1?255:0], on=d&BITS[k], col=[0,0,0];\n          for(var q=0;q\u003c3;q++){ var P=(on&&q===k)?255:0; col[q]=Math.round(C[q]*(1-t)+P*t); }\n          var x=px+k*s/3+gx, w=s/3-2*gx, h=s-2*gy;\n          if(!on){ // dim outline of the unlit stripe, so the RGB grid shows\n            var dim=[0,0,0]; dim[k]=255;\n            ctx.fillStyle='rgba('+dim.join(',')+','+(0.13*t)+')'; ctx.fillRect(x,y+gy,w,h);\n          }\n          if(col[0]||col[1]||col[2]){ ctx.fillStyle='rgb('+col.join(',')+')'; ctx.fillRect(x,y+gy,w,h); }\n        }\n      }\n      if(ci>=0 && t>0.5 && s>=9){\n        ctx.fillStyle=tok('--muted')||'#888'; ctx.textAlign='center';\n        ctx.font=Math.min(13,s*0.8)+'px '+(tok('--font-mono')||'monospace');\n        ctx.fillText(g.cs[ci],px+s/2,g.y0+5*s+14);\n      }\n    }\n    if(sel\u003cg.cs.length){\n      var sx=g.x0+2*sel*g.s;\n      ctx.strokeStyle=tok('--accent2')||'#fc0'; ctx.lineWidth=2;\n      ctx.strokeRect(sx-3,g.y0-3,g.s+6,5*g.s+6);\n    }\n    var sc=s\u003c10?s.toFixed(1):Math.round(s);\n    var txt;\n    if(t\u003c0.12) txt='From afar each letter is one column of 5 coloured pixels. Looks like confetti, not text. (1 pixel = '+sc+'px here)';\n    else if(t\u003c0.88) txt='Closer… every pixel is really three thin lights side by side: red, green, blue.';\n    else txt='Aha: the red, green and blue stripes are the 3 columns of each letter. 3 × 5 dots in a single pixel width.';\n    cap.textContent=txt;\n  }\n\n  function drawReal(){\n    var cs=chars(), n=cs.length*2-1, rd=window.devicePixelRatio||1;\n    real.width=n; real.height=5;\n    real.style.width=(n/rd)+'px'; real.style.height=(5/rd)+'px';\n    var im=rctx.createImageData(n,5);\n    for(var i=0;i\u003ccs.length;i++){ var gl=glyph(cs[i]);\n      for(var r=0;r\u003c5;r++){ var d=parseInt(gl[r],10), o=(r*n+2*i)*4;\n        im.data[o]=d&4?255:0; im.data[o+1]=d&2?255:0; im.data[o+2]=d&1?255:0; im.data[o+3]=255; } }\n    for(var p=3;p\u003cim.data.length;p+=4) im.data[p]=255;\n    rctx.putImageData(im,0,0);\n    realcap.textContent=n+' × 5 real pixels. Try a magnifying glass on a laptop screen.';\n  }\n\n  // editor\n  var cells=[], swatches=[];\n  for(var r=0;r\u003c5;r++){\n    for(var k=0;k\u003c3;k++){ (function(r,k){\n      var b=document.createElement('button'); b.type='button';\n      b.addEventListener('click',function(){ toggle(r,k); }); grid.appendChild(b); cells.push(b);\n    })(r,k); }\n    var sw=document.createElement('div'); pxcol.appendChild(sw); swatches.push(sw);\n  }\n  function toggle(r,k){\n    var cs=chars(); if(sel>=cs.length) return;\n    var kk=key(cs[sel]), gl=F[kk].split(''), d=parseInt(gl[r],10)^BITS[k];\n    gl[r]=String(d); F[kk]=gl.join('');\n    edcap.textContent='Row '+(r+1)+': '+CH[k]+' '+((d&BITS[k])?'on':'off')+', so that pixel is now '+NAMES[d]+'. Every \"'+kk+'\" changes.';\n    refresh(true);\n  }\n  function editor(keepCap){\n    var cs=chars(); if(sel>=cs.length) sel=cs.length-1;\n    var c=cs[sel], kk=key(c), gl=F[kk], names=[];\n    for(var r=0;r\u003c5;r++){ var d=parseInt(gl[r],10); names.push(NAMES[d]);\n      swatches[r].style.background=rgb(d);\n      for(var k=0;k\u003c3;k++){ var b=cells[r*3+k], on=d&BITS[k], col=[0,0,0]; col[k]=255;\n        b.style.background=on?'rgb('+col.join(',')+')':'var(--bg)';\n        b.setAttribute('aria-label','Row '+(r+1)+' '+CH[k]+(on?' on':' off')); } }\n    if(!keepCap) edcap.textContent=(c===' '?'Space':'\"'+kk+'\"')+' as stripes = one pixel column: '+names.join(', ')+'. Tap a stripe to flip it, or tap a letter above.';\n  }\n  function refresh(keepCap){ draw(); drawReal(); editor(keepCap); }\n\n  // input\n  inp.addEventListener('input',function(){ text=inp.value; sel=Math.max(0,text.length-1); cx=1; refresh(); });\n  zoom.addEventListener('input',draw);\n  reset.addEventListener('click',function(){ resetFont(); refresh(); });\n\n  // drag to pan, tap to pick a letter\n  var down=null;\n  cv.addEventListener('pointerdown',function(e){ down={x:e.clientX,y:e.clientY,cx:cx,moved:false}; try{cv.setPointerCapture(e.pointerId);}catch(_){} });\n  cv.addEventListener('pointermove',function(e){\n    if(!down) return; var dx=e.clientX-down.x;\n    if(Math.abs(dx)>4){ down.moved=true; cv.classList.add('drag'); }\n    if(down.moved){ var g=geom(); if(g.total>W-24){ cx=Math.min(1,Math.max(0,down.cx-dx/g.total)); draw(); } }\n  });\n  function up(e){\n    if(!down) return; cv.classList.remove('drag');\n    if(!down.moved){ var rc=cv.getBoundingClientRect(), x=(e.clientX-rc.left)*W/rc.width, g=geom();\n      var j=Math.floor((x-g.x0)/g.s); if(j>=0&&j\u003cg.n){ sel=Math.round(j/2); if(sel>=g.cs.length)sel=g.cs.length-1; refresh(); } }\n    down=null;\n  }\n  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',function(){down=null;cv.classList.remove('drag');});\n\n  // zoom button\n  var anim=null;\n  go.addEventListener('click',function(){\n    var from=+zoom.value, to=from>600?0:1000;\n    go.textContent=to?'Zoom out':'Zoom in';\n    if(reduce){ zoom.value=to; draw(); return; }\n    if(anim) cancelAnimationFrame(anim);\n    var t0=performance.now(), dur=2200;\n    (function step(now){ var p=Math.min(1,(now-t0)/dur), e=p\u003c.5?2*p*p:1-Math.pow(-2*p+2,2)/2;\n      zoom.value=from+(to-from)*e; draw(); if(p\u003c1) anim=requestAnimationFrame(step); })(t0);\n  });\n  zoom.addEventListener('input',function(){ go.textContent=zoom.value>600?'Zoom out':'Zoom in'; });\n\n  text=inp.value; sel=0;\n  if(window.ResizeObserver) new ResizeObserver(function(){ layout(); }).observe(root);\n  else window.addEventListener('resize',layout);\n  layout(); drawReal(); editor();\n})();\n\u003c/script>\n\u003c/div>","date":1795107016223,"order":23},{"id":"the-seven-bridges-of-ko-nigsberg-koni","title":"The seven bridges of Königsberg","foundAt":"a puzzle book, and an old city map","hook":"The people of Königsberg tried for years to walk across all seven bridges exactly once. A mathematician proved they never could, and invented a new kind of maths doing it.","story":"In the 1700s the Prussian city of Königsberg (today Kaliningrad) sat on both banks of a river with two islands, joined by seven bridges. A Sunday pastime: find a walk that crosses every bridge **exactly once**. Nobody managed it.\n\nIn 1736 Leonhard Euler showed why. He ignored streets, distances and shapes, and kept only *which places connect to which*. Every time you walk through a place, you use two bridges: one in, one out. So every place you merely pass through needs an **even** number of bridges. Only your starting point and your end point may be odd.\n\nKönigsberg had four places, and all four had an odd number of bridges. Case closed. That way of thinking, dots joined by lines, is now called **graph theory**. It routes your parcels, your phone calls and your map directions.\n\nTry removing one bridge or building a new one above, and watch the walk become possible.","tags":["puzzles","graphs"],"sources":[{"label":"Seven Bridges of Königsberg puzzle (Puzzlewocky)","url":"https://puzzlewocky.com/brain-teasers/unsolvable-puzzles/seven-bridges-of-konigsberg-puzzle/"},{"label":"Euler's original problem (Wikipedia)","url":"https://en.wikipedia.org/wiki/Seven_Bridges_of_K%C3%B6nigsberg"}],"cover":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 200\" aria-hidden=\"true\" focusable=\"false\">\u003crect class=\"tint\" x=\"0\" y=\"72\" width=\"320\" height=\"56\"/>\u003cellipse class=\"fl\" cx=\"104\" cy=\"100\" rx=\"44\" ry=\"15\" opacity=\".8\"/>\u003cpath class=\"sa\" d=\"M160,34 Q110 44 104,100\"/>\u003cpath class=\"sa\" d=\"M160,34 Q162 92 104,100\"/>\u003cpath class=\"sa\" d=\"M160,166 Q110 156 104,100\"/>\u003cpath class=\"sa\" d=\"M160,166 Q162 108 104,100\"/>\u003cpath class=\"sa\" d=\"M104,100 L252,100\"/>\u003cpath class=\"sa\" d=\"M160,34 Q244 38 252,100\"/>\u003cpath class=\"sa\" d=\"M160,166 Q244 162 252,100\"/>\u003ccircle class=\"fp\" cx=\"160\" cy=\"34\" r=\"10\"/>\u003ccircle class=\"st\" cx=\"160\" cy=\"34\" r=\"10\"/>\u003ccircle class=\"fp\" cx=\"160\" cy=\"166\" r=\"10\"/>\u003ccircle class=\"st\" cx=\"160\" cy=\"166\" r=\"10\"/>\u003ccircle class=\"fp\" cx=\"104\" cy=\"100\" r=\"10\"/>\u003ccircle class=\"st\" cx=\"104\" cy=\"100\" r=\"10\"/>\u003ccircle class=\"fp\" cx=\"252\" cy=\"100\" r=\"10\"/>\u003ccircle class=\"st\" cx=\"252\" cy=\"100\" r=\"10\"/>\u003ccircle class=\"fb\" cx=\"178\" cy=\"26\" r=\"9\"/>\u003ctext class=\"lbl\" x=\"178\" y=\"30\" text-anchor=\"middle\" style=\"fill:var(--fg)\">3\u003c/text>\u003ccircle class=\"fb\" cx=\"178\" cy=\"158\" r=\"9\"/>\u003ctext class=\"lbl\" x=\"178\" y=\"162\" text-anchor=\"middle\" style=\"fill:var(--fg)\">3\u003c/text>\u003ccircle class=\"fb\" cx=\"78\" cy=\"92\" r=\"9\"/>\u003ctext class=\"lbl\" x=\"78\" y=\"96\" text-anchor=\"middle\" style=\"fill:var(--fg)\">5\u003c/text>\u003ccircle class=\"fb\" cx=\"270\" cy=\"92\" r=\"9\"/>\u003ctext class=\"lbl\" x=\"270\" y=\"96\" text-anchor=\"middle\" style=\"fill:var(--fg)\">3\u003c/text>\u003ctext class=\"lbl\" x=\"300\" y=\"192\" text-anchor=\"end\">all odd · no walk\u003c/text>\u003c/svg>","demo":"\u003cstyle>\n.kb{display:grid;gap:12px;padding:16px}\n.kb svg{width:100%;height:auto;display:block;border-radius:var(--radius);border:1px solid var(--line);touch-action:manipulation}\n.kb .ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}\n.kb .status{font:600 16px/1.4 var(--font-body);min-height:2.8em}\n.kb .land{cursor:pointer}\n.kb .bridge{cursor:pointer}\n.kb .bridge:focus-visible{outline:none}\n.kb .bridge:focus-visible rect{stroke:var(--accent);stroke-width:4}\n\u003c/style>\n\u003cdiv class=\"kb\">\n  \u003cdiv class=\"ctrls\">\n    \u003cdiv class=\"hg-seg\" role=\"group\" aria-label=\"Mode\">\n      \u003cbutton id=\"mWalk\" aria-pressed=\"true\">Take a walk\u003c/button>\n      \u003cbutton id=\"mEdit\" aria-pressed=\"false\">Add or remove bridges\u003c/button>\n    \u003c/div>\n    \u003cbutton id=\"reset\">Start over\u003c/button>\n    \u003clabel class=\"hg-caption\">\u003cinput type=\"checkbox\" id=\"count\"> Count bridges at each place\u003c/label>\n  \u003c/div>\n  \u003csvg id=\"map\" viewBox=\"0 0 640 360\" role=\"img\" aria-label=\"Map of Königsberg: two river banks, an island and an eastern land, joined by bridges\">\u003c/svg>\n  \u003cdiv class=\"status\" id=\"status\" aria-live=\"polite\">\u003c/div>\n  \u003cdiv class=\"hg-caption\" id=\"rule\">\u003c/div>\n\u003c/div>\n\u003cscript>\n(() => {\n  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n  const C = { fg: css('--fg'), muted: css('--muted'), accent: css('--accent'), accent2: css('--accent2'), line: css('--line'), bg: css('--bg'), panel: css('--panel') };\n  const water = '#4a90c8';\n  const LANDS = { A: 'the north bank', B: 'the south bank', C: 'the island', D: 'the east side' };\n  const BADGE = { A: [80, 60], B: [80, 300], C: [230, 180], D: [520, 180] };\n  const B0 = [\n    { id: 'a', u: 'A', v: 'C', x: 170, y: 116, w: 22, h: 46, on: true },\n    { id: 'b', u: 'A', v: 'C', x: 290, y: 116, w: 22, h: 46, on: true },\n    { id: 'c', u: 'B', v: 'C', x: 170, y: 198, w: 22, h: 46, on: true },\n    { id: 'd', u: 'B', v: 'C', x: 290, y: 198, w: 22, h: 46, on: true },\n    { id: 'e', u: 'C', v: 'D', x: 316, y: 169, w: 158, h: 22, on: true },\n    { id: 'f', u: 'A', v: 'D', x: 540, y: 116, w: 22, h: 28, on: true },\n    { id: 'g', u: 'B', v: 'D', x: 540, y: 216, w: 22, h: 28, on: true },\n    { id: 'h', u: 'A', v: 'D', x: 600, y: 116, w: 22, h: 28, on: false },\n    { id: 'i', u: 'B', v: 'C', x: 230, y: 206, w: 22, h: 38, on: false },\n  ];\n  let bridges = B0.map(b => ({ ...b })), mode = 'walk', at = null, used = [], trailPts = [];\n  const svg = document.getElementById('map'), NS = 'http://www.w3.org/2000/svg';\n  const el = (t, a, p = svg) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };\n  const deg = () => { const d = { A: 0, B: 0, C: 0, D: 0 }; bridges.filter(b => b.on).forEach(b => { d[b.u]++; d[b.v]++; }); return d; };\n  function connected() {\n    const on = bridges.filter(b => b.on); if (!on.length) return true;\n    const seen = new Set([on[0].u]); let grew = true;\n    while (grew) { grew = false; on.forEach(b => { if (seen.has(b.u) !== seen.has(b.v)) { seen.add(b.u); seen.add(b.v); grew = true; } }); }\n    return on.every(b => seen.has(b.u));\n  }\n  function verdict() {\n    const d = deg(), odd = Object.keys(d).filter(k => d[k] % 2);\n    if (!connected()) return 'These bridges fall into separate groups, so no single walk can reach them all.';\n    if (odd.length === 0) return 'Every place has an even number of bridges, so a walk can cross each bridge once and end where it started.';\n    if (odd.length === 2) return 'Exactly two places have an odd count (' + odd.map(k => LANDS[k]).join(' and ') + '). A walk is possible, but it must start at one of them and end at the other.';\n    return odd.length + ' places have an odd number of bridges. Every place you pass through uses bridges in pairs, one in and one out, so at most two places can be odd. No walk works.';\n  }\n  function draw() {\n    svg.innerHTML = '';\n    el('rect', { x: 0, y: 0, width: 640, height: 360, fill: C.panel });\n    el('rect', { x: 0, y: 120, width: 640, height: 120, fill: water, opacity: .55 });\n    const land = (k, node) => { node.setAttribute('class', 'land'); node.setAttribute('fill', at === k ? C.accent + '30' : C.bg); node.setAttribute('stroke', C.line); node.setAttribute('stroke-width', 2); node.addEventListener('click', () => pickLand(k)); };\n    land('A', el('rect', { x: 0, y: 0, width: 640, height: 120 }));\n    land('B', el('rect', { x: 0, y: 240, width: 640, height: 120 }));\n    land('C', el('ellipse', { cx: 230, cy: 180, rx: 92, ry: 34 }));\n    land('D', el('path', { d: 'M470 140 H640 V220 H470 Q450 180 470 140Z' }));\n    Object.entries({ A: 'North bank', B: 'South bank', C: 'Island', D: 'East' }).forEach(([k, t]) => {\n      const [x, y] = k === 'C' ? [230, 185] : k === 'D' ? [580, 212] : [320, k === 'A' ? 66 : 306];\n      const tx = el('text', { x, y, 'text-anchor': 'middle', fill: C.muted, 'font-size': 15, 'font-family': css('--font-mono'), 'pointer-events': 'none' }); tx.textContent = t;\n    });\n    bridges.forEach(b => {\n      if (!b.on && mode !== 'edit') return;\n      const g = el('g', { class: 'bridge', tabindex: 0, role: 'button', 'aria-label': (b.on ? 'Bridge between ' : 'Possible new bridge between ') + LANDS[b.u] + ' and ' + LANDS[b.v] });\n      const isUsed = used.includes(b.id);\n      el('rect', { x: b.x, y: b.y, width: b.w, height: b.h, rx: 3, fill: !b.on ? 'none' : isUsed ? C.accent : C.accent2, stroke: b.on ? C.fg : C.muted, 'stroke-width': 2, 'stroke-dasharray': b.on ? '' : '5 4' }, g);\n      if (!b.on) { const t = el('text', { x: b.x + b.w / 2, y: b.y + b.h / 2 + 6, 'text-anchor': 'middle', fill: C.muted, 'font-size': 18 }, g); t.textContent = '+'; }\n      const go = () => clickBridge(b);\n      g.addEventListener('click', go); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });\n    });\n    if (trailPts.length > 1) el('polyline', { points: trailPts.map(p => p.join(',')).join(' '), fill: 'none', stroke: C.accent, 'stroke-width': 3, 'stroke-dasharray': '2 6', 'stroke-linecap': 'round', 'pointer-events': 'none' });\n    if (at) { const [x, y] = BADGE[at]; el('circle', { cx: x + (at === 'C' ? -50 : 0), cy: y, r: 12, fill: C.accent, stroke: C.bg, 'stroke-width': 3, 'pointer-events': 'none' }); }\n    if (document.getElementById('count').checked) {\n      const d = deg();\n      Object.keys(d).forEach(k => { const [x, y] = BADGE[k]; const bx = k === 'C' ? x + 52 : k === 'D' ? x + 95 : x + 480; const odd = d[k] % 2;\n        el('circle', { cx: bx, cy: y, r: 17, fill: odd ? '#d9483b' : C.accent, 'pointer-events': 'none' });\n        const t = el('text', { x: bx, y: y + 6, 'text-anchor': 'middle', fill: '#fff', 'font-size': 17, 'font-weight': 700, 'font-family': css('--font-mono'), 'pointer-events': 'none' }); t.textContent = d[k]; });\n    }\n    status();\n  }\n  const mid = b => [b.x + b.w / 2, b.y + b.h / 2];\n  const landPt = k => k === 'C' ? [230, 180] : k === 'D' ? [540, 180] : [null, k === 'A' ? 80 : 280];\n  function pickLand(k) { if (mode !== 'walk') return; if (used.length) return; at = k; trailPts = []; draw(); }\n  function clickBridge(b) {\n    if (mode === 'edit') { b.on = !b.on; used = []; at = null; trailPts = []; draw(); return; }\n    if (!b.on) return;\n    if (!at) { at = b.u; }\n    if (used.includes(b.id)) { flash('You already crossed that bridge.'); return; }\n    if (b.u !== at && b.v !== at) { flash('That bridge does not touch ' + LANDS[at] + '. Walk only from where you are.'); return; }\n    const to = b.u === at ? b.v : b.u, m = mid(b);\n    const from = landPt(at); if (!trailPts.length) trailPts.push([from[0] ?? m[0], from[1]]);\n    trailPts.push(m); const t = landPt(to); trailPts.push([t[0] ?? m[0], t[1]]);\n    used.push(b.id); at = to; draw();\n  }\n  let flashMsg = '';\n  function flash(m) { flashMsg = m; status(); setTimeout(() => { flashMsg = ''; status(); }, 2200); }\n  function status() {\n    const s = document.getElementById('status'), on = bridges.filter(b => b.on);\n    document.getElementById('rule').textContent = verdict();\n    if (flashMsg) { s.textContent = flashMsg; return; }\n    if (mode === 'edit') { s.textContent = 'Tap a bridge to remove it, or a dashed + to build one. ' + on.length + ' bridges now.'; return; }\n    if (!at) { s.textContent = 'Pick a place to start, then cross bridges one at a time. Can you cross all ' + on.length + ' exactly once?'; return; }\n    const left = on.filter(b => !used.includes(b.id)), next = left.filter(b => b.u === at || b.v === at);\n    if (!left.length) s.textContent = 'You crossed every bridge exactly once. Euler would be delighted.';\n    else if (!next.length) s.textContent = 'Stuck on ' + LANDS[at] + ' with ' + left.length + ' bridge' + (left.length > 1 ? 's' : '') + ' still uncrossed.';\n    else s.textContent = 'Crossed ' + used.length + ' of ' + on.length + '. You are on ' + LANDS[at] + '.';\n  }\n  function setMode(m) { mode = m; document.getElementById('mWalk').setAttribute('aria-pressed', m === 'walk'); document.getElementById('mEdit').setAttribute('aria-pressed', m === 'edit'); used = []; at = null; trailPts = []; draw(); }\n  document.getElementById('mWalk').onclick = () => setMode('walk');\n  document.getElementById('mEdit').onclick = () => setMode('edit');\n  document.getElementById('reset').onclick = () => { used = []; at = null; trailPts = []; draw(); };\n  document.getElementById('count').onchange = draw;\n  draw();\n})();\n\u003c/script>\n","date":1795089000082,"order":2},{"id":"drilling-a-square-hole-reul","title":"Drilling a square hole","foundAt":"a machinist's video, and the 50p coin","hook":"A drill bit can cut an almost perfectly square hole. The trick is a triangle with curved sides.","story":"Draw an equilateral triangle. Put the compass point on one corner and swing an arc between the other two corners. Do that from each corner and you get a **Reuleaux triangle**: a triangle with bulging sides.\n\nIts magic property is **constant width**. Squeeze it between two parallel boards at any angle and the gap is always the same, just like a circle. That is why a plank resting on Reuleaux rollers glides perfectly level, and why engineers checking whether a part is \"round\" cannot rely on calipers alone.\n\nBecause its width matches the side of a square in every direction, it can spin inside a square while touching all four walls. Mount it on a drill with a centre that is allowed to wobble, and it carves out 98.8% of a square. Only the corners stay slightly rounded.\n\n### The coin in your pocket\n\nThe British 50p and 20p coins are **Reuleaux heptagons**: seven curved sides, still constant width. Coin slots measure width, so a seven-sided coin rolls and measures like a round one while looking distinctive.","tags":["curves","objects"],"sources":[{"label":"Drilling a square hole (howround.com video)","url":"http://www.howround.com/"},{"label":"Reuleaux triangle on Wikipedia","url":"https://en.wikipedia.org/wiki/Reuleaux_triangle"},{"label":"How do they design coins with polygons?","url":"https://en.wikipedia.org/wiki/Curve_of_constant_width"}],"cover":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 200\" aria-hidden=\"true\" focusable=\"false\">\u003crect class=\"tint\" x=\"100\" y=\"40\" width=\"120\" height=\"120\" rx=\"9\"/>\u003crect class=\"st\" x=\"100\" y=\"40\" width=\"120\" height=\"120\"/>\u003cpath class=\"fb\" d=\"M160 40 A120 120 0 0 1 220 143.92 A120 120 0 0 1 100 143.92 A120 120 0 0 1 160 40 Z\" opacity=\".9\"/>\u003cpath class=\"st\" d=\"M160 40 A120 120 0 0 1 220 143.92 A120 120 0 0 1 100 143.92 A120 120 0 0 1 160 40 Z\"/>\u003ccircle class=\"fm\" cx=\"160\" cy=\"109.28\" r=\"3\"/>\u003cpath class=\"sa\" d=\"M244 64 A52 52 0 0 1 244 136\"/>\u003cpath class=\"sa\" d=\"M236 130 L244 137 L252 129\"/>\u003cpath class=\"sm\" d=\"M100 178 H220 M100 172 V184 M220 172 V184\"/>\u003ctext class=\"lbl\" x=\"160\" y=\"196\" text-anchor=\"middle\">same width every way\u003c/text>\u003c/svg>","demo":"\u003cstyle>\n.rw{display:grid;gap:14px;padding:16px}\n.rw .stage{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}\n.rw .panel{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--bg);display:grid;gap:8px;min-width:0}\n.rw canvas{width:100%;height:auto;aspect-ratio:1;display:block}\n.rw h4{margin:0;font:600 12px/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\n.rw .ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}\n.rw .big{font:600 15px/1.35 var(--font-body);color:var(--fg)}\n\u003c/style>\n\u003cdiv class=\"rw\">\n  \u003cdiv class=\"ctrls\">\n    \u003cdiv class=\"hg-seg\" role=\"group\" aria-label=\"Shape\">\n      \u003cbutton data-n=\"0\">Circle\u003c/button>\n      \u003cbutton data-n=\"3\" aria-pressed=\"true\">Reuleaux triangle\u003c/button>\n      \u003cbutton data-n=\"5\">Reuleaux pentagon\u003c/button>\n      \u003cbutton data-n=\"7\">Heptagon (50p coin)\u003c/button>\n      \u003cbutton data-n=\"-4\">Square\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"ctrls\">\n    \u003cbutton id=\"play\">Pause\u003c/button>\n    \u003clabel class=\"hg-caption\">Turn \u003cinput id=\"turn\" type=\"range\" min=\"0\" max=\"360\" value=\"0\" step=\"1\" aria-label=\"Rotation angle\">\u003c/label>\n    \u003clabel class=\"hg-caption\">\u003cinput type=\"checkbox\" id=\"trace\" checked> Trace a corner\u003c/label>\n  \u003c/div>\n  \u003cdiv class=\"stage\">\n    \u003cdiv class=\"panel\">\u003ch4>Spinning in a square hole\u003c/h4>\u003ccanvas id=\"ca\" width=\"520\" height=\"520\">\u003c/canvas>\u003cdiv class=\"big\" id=\"capA\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"panel\">\u003ch4>Rolling under a plank\u003c/h4>\u003ccanvas id=\"cb\" width=\"520\" height=\"520\">\u003c/canvas>\u003cdiv class=\"big\" id=\"capB\">\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cscript>\n(() => {\n  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n  const C = { fg: css('--fg'), muted: css('--muted'), accent: css('--accent'), accent2: css('--accent2'), line: css('--line'), bg: css('--bg'), panel: css('--panel') };\n  const ca = document.getElementById('ca'), cb = document.getElementById('cb');\n  const xa = ca.getContext('2d'), xb = cb.getContext('2d');\n  const W = 300; // shape width in canvas px\n  let n = 3, theta = 0, playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;\n  let trail = [], ctrTrail = [], heights = [], coverage = 0;\n\n  function shape(n, w) {\n    // returns {pts, corner} in local coords (centred), unrotated\n    const pts = [];\n    if (n === 0) { for (let i = 0; i \u003c 180; i++) { const a = i / 180 * Math.PI * 2; pts.push([Math.cos(a) * w / 2, Math.sin(a) * w / 2]); } return { pts, corner: 0 }; }\n    if (n === -4) { const s = w / 2; [[-s,-s],[s,-s],[s,s],[-s,s]].forEach(p => { for (let i = 0; i \u003c 20; i++) pts.push(p); }); return { pts: [[-s,-s],[s,-s],[s,s],[-s,s]], corner: 0 }; }\n    const k = (n - 1) / 2;\n    const R = w / (2 * Math.sin(Math.PI * k / n));\n    const V = [];\n    for (let i = 0; i \u003c n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; V.push([R * Math.cos(a), R * Math.sin(a)]); }\n    for (let i = 0; i \u003c n; i++) {\n      const A = V[i], B = V[(i + 1) % n], O = V[(i + (n + 1) / 2) % n];\n      let a0 = Math.atan2(A[1] - O[1], A[0] - O[0]), a1 = Math.atan2(B[1] - O[1], B[0] - O[0]);\n      let d = a1 - a0; while (d > Math.PI) d -= 2 * Math.PI; while (d \u003c -Math.PI) d += 2 * Math.PI;\n      const steps = Math.ceil(240 / n);\n      for (let j = 0; j \u003c steps; j++) { const a = a0 + d * j / steps; pts.push([O[0] + w * Math.cos(a), O[1] + w * Math.sin(a)]); }\n    }\n    return { pts, corner: 0 };\n  }\n  let S = shape(3, W);\n  const rot = (p, t) => [p[0] * Math.cos(t) - p[1] * Math.sin(t), p[0] * Math.sin(t) + p[1] * Math.cos(t)];\n  function bbox(P) { let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity; for (const p of P) { a = Math.min(a, p[0]); b = Math.min(b, p[1]); c = Math.max(c, p[0]); d = Math.max(d, p[1]); } return [a, b, c, d]; }\n  const constant = () => n !== -4;\n  function placed(t) {\n    const P = S.pts.map(p => rot(p, t));\n    const [x0, y0, x1, y1] = bbox(P);\n    // constant-width shapes: bbox is always W x W, so pin it to the hole\n    const hx = 110, hy = 110;\n    const dx = constant() ? hx - x0 : 260 - (x0 + x1) / 2, dy = constant() ? hy - y0 : 260 - (y0 + y1) / 2;\n    return { P: P.map(p => [p[0] + dx, p[1] + dy]), c: [dx, dy], corner: [P[0][0] + dx, P[0][1] + dy] };\n  }\n  function computeCoverage() {\n    if (!constant()) { coverage = 0; return; }\n    const oc = document.createElement('canvas'); oc.width = oc.height = 520; const o = oc.getContext('2d');\n    o.fillStyle = '#000';\n    for (let i = 0; i \u003c 360; i += 1) { const { P } = placed(i * Math.PI / 180); o.beginPath(); P.forEach((p, j) => j ? o.lineTo(p[0], p[1]) : o.moveTo(p[0], p[1])); o.closePath(); o.fill(); }\n    const d = o.getImageData(110, 110, W, W).data; let on = 0; for (let i = 3; i \u003c d.length; i += 4) if (d[i] > 127) on++;\n    coverage = on / (W * W);\n  }\n  function path(x, P) { x.beginPath(); P.forEach((p, j) => j ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); }\n  function drawA() {\n    xa.clearRect(0, 0, 520, 520);\n    // hole\n    xa.fillStyle = C.panel; xa.fillRect(0, 0, 520, 520);\n    xa.fillStyle = C.bg; xa.fillRect(110, 110, W, W);\n    xa.strokeStyle = C.fg; xa.lineWidth = 2; xa.strokeRect(110, 110, W, W);\n    const { P, c, corner } = placed(theta);\n    if (document.getElementById('trace').checked) {\n      trail.push(corner); if (trail.length > 400) trail.shift();\n      ctrTrail.push(c); if (ctrTrail.length > 400) ctrTrail.shift();\n      xa.strokeStyle = C.accent2; xa.lineWidth = 2.5; xa.beginPath(); trail.forEach((p, j) => j ? xa.lineTo(p[0], p[1]) : xa.moveTo(p[0], p[1])); xa.stroke();\n      if (constant() && n) { xa.strokeStyle = C.muted; xa.lineWidth = 1; xa.beginPath(); ctrTrail.forEach((p, j) => j ? xa.lineTo(p[0], p[1]) : xa.moveTo(p[0], p[1])); xa.stroke(); }\n    }\n    path(xa, P);\n    xa.fillStyle = constant() ? C.accent + '33' : '#d9483b44'; xa.fill();\n    xa.strokeStyle = constant() ? C.accent : '#d9483b'; xa.lineWidth = 3; xa.stroke();\n    xa.fillStyle = C.accent2; xa.beginPath(); xa.arc(corner[0], corner[1], 6, 0, 7); xa.fill();\n  }\n  function drawB() {\n    xb.clearRect(0, 0, 520, 520); xb.fillStyle = C.panel; xb.fillRect(0, 0, 520, 520);\n    const G = 380; const P = S.pts.map(p => rot(p, theta));\n    const [x0, y0, x1, y1] = bbox(P); const dy = G - y1, dx = 260 - (x0 + x1) / 2;\n    const top = y0 + dy;\n    // ground with moving ticks\n    xb.strokeStyle = C.fg; xb.lineWidth = 2; xb.beginPath(); xb.moveTo(0, G); xb.lineTo(520, G); xb.stroke();\n    const off = (theta * W / 2) % 40; xb.strokeStyle = C.line; xb.lineWidth = 2;\n    for (let x = -off; x \u003c 520; x += 40) { xb.beginPath(); xb.moveTo(x, G + 4); xb.lineTo(x - 10, G + 16); xb.stroke(); }\n    // reference line of the starting plank height\n    xb.setLineDash([6, 6]); xb.strokeStyle = C.muted; xb.lineWidth = 1; xb.beginPath(); xb.moveTo(0, G - W); xb.lineTo(520, G - W); xb.stroke(); xb.setLineDash([]);\n    path(xb, P.map(p => [p[0] + dx, p[1] + dy]));\n    xb.fillStyle = constant() ? C.accent + '33' : '#d9483b44'; xb.fill(); xb.strokeStyle = constant() ? C.accent : '#d9483b'; xb.lineWidth = 3; xb.stroke();\n    xb.fillStyle = C.accent2; xb.fillRect(60, top - 16, 400, 16); xb.strokeStyle = C.fg; xb.lineWidth = 1.5; xb.strokeRect(60, top - 16, 400, 16);\n    // height trace strip\n    heights.push(G - top); if (heights.length > 260) heights.shift();\n    xb.strokeStyle = C.accent; xb.lineWidth = 2; xb.beginPath();\n    heights.forEach((hh, i) => { const x = 130 + i, y = 470 - (hh - W) * 0.9; i ? xb.lineTo(x, y) : xb.moveTo(x, y); }); xb.stroke();\n    xb.fillStyle = C.muted; xb.font = '12px ' + css('--font-mono'); xb.fillText('plank height', 20, 474);\n    const pct = ((G - top) / W - 1) * 100;\n    document.getElementById('capB').textContent = constant()\n      ? 'The plank never moves up or down: every direction measures the same width.'\n      : 'The plank bobs by up to ' + Math.round((Math.SQRT2 - 1) * 100) + '% (now +' + Math.max(0, pct).toFixed(0) + '%). A square is wider across its corners.';\n  }\n  function caption() {\n    const A = document.getElementById('capA');\n    if (n === -4) A.textContent = 'A square can only turn in a square hole if its corners cut through the walls.';\n    else if (n === 0) A.textContent = 'A circle turns smoothly but drills only ' + (coverage * 100).toFixed(1) + '% of the square. The corners stay full.';\n    else A.textContent = 'This shape always touches all four walls while it turns, and sweeps ' + (coverage * 100).toFixed(1) + '% of the square. Watch the yellow corner draw an almost-square.';\n  }\n  function frame() {\n    if (playing) { theta = (theta + 0.012) % (Math.PI * 2); document.getElementById('turn').value = Math.round(theta * 180 / Math.PI); }\n    drawA(); drawB(); requestAnimationFrame(frame);\n  }\n  document.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => {\n    document.querySelectorAll('[data-n]').forEach(x => x.setAttribute('aria-pressed', x === b));\n    n = +b.dataset.n; S = shape(n, W); trail = []; ctrTrail = []; heights = []; computeCoverage(); caption();\n  }));\n  const pb = document.getElementById('play');\n  const setPlay = p => { playing = p; pb.textContent = p ? 'Pause' : 'Play'; };\n  pb.addEventListener('click', () => setPlay(!playing));\n  document.getElementById('turn').addEventListener('input', e => { setPlay(false); theta = e.target.value * Math.PI / 180; });\n  document.getElementById('trace').addEventListener('change', () => { trail = []; ctrTrail = []; });\n  setPlay(playing); computeCoverage(); caption(); frame();\n})();\n\u003c/script>\n","date":1795089001082,"order":1},{"id":"a-map-that-knows-if-a-number-divides-by-7-seve","title":"A map that knows if a number divides by 7","foundAt":"a diagram from Mind Your Decisions","hook":"Walk around a little circle of arrows, one digit at a time. If you finish on YES, your number is divisible by 7.","story":"There is no neat test for 7 like there is for 3 or 9. But there is a **map**. Start on YES. For each digit, step forward that many black arrows. Then take one green arrow and move on to the next digit. After the last digit, if you are back on YES, the number divides by 7.\n\nThe trick is that each circle is a **remainder**. Black arrows add 1. Green arrows multiply by 10, because writing one more digit after a number is the same as multiplying it by 10 and adding the new digit. Since 10 leaves remainder 3 when divided by 7, the green arrow from 1 goes to 3, from 2 goes to 6, and so on.\n\nNothing about this is special to 7. Change the divisor above and the map redraws itself. Computer scientists call machines like this **finite automata**: they read one symbol at a time and only remember which circle they are on.","tags":["numbers","graphs"],"sources":[{"label":"Divisibility by 7 graph (Mind Your Decisions)","url":"https://mindyourdecisions.com/blog/"}],"cover":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 200\" aria-hidden=\"true\" focusable=\"false\">\u003ccircle class=\"sm\" cx=\"160\" cy=\"100\" r=\"70\" opacity=\".7\"/>\u003cpath class=\"sa\" d=\"M214.73 56.36 Q174.89 103.4 190.37 163.07\" opacity=\".85\"/>\u003cpath class=\"sa\" d=\"M228.24 115.58 Q162.36 95.09 105.27 56.36\" opacity=\".85\"/>\u003cpath class=\"sa\" d=\"M190.37 163.07 Q177.26 113.76 228.24 115.58\" opacity=\".85\"/>\u003cpath class=\"sa\" d=\"M129.63 163.07 Q142.74 113.76 91.76 115.58\" opacity=\".85\"/>\u003cpath class=\"sa\" d=\"M91.76 115.58 Q157.64 95.09 214.73 56.36\" opacity=\".85\"/>\u003cpath class=\"sa\" d=\"M105.27 56.36 Q145.11 103.4 129.63 163.07\" opacity=\".85\"/>\u003cpath class=\"sa\" d=\"M154 22 C138 -4 182 -4 166 22\"/>\u003ccircle class=\"fa\" cx=\"160\" cy=\"30\" r=\"11\"/>\u003ccircle class=\"st\" cx=\"160\" cy=\"30\" r=\"11\"/>\u003ctext class=\"lbl\" x=\"160\" y=\"34\" text-anchor=\"middle\" style=\"fill:var(--panel)\">0\u003c/text>\u003ccircle class=\"fp\" cx=\"214.73\" cy=\"56.36\" r=\"11\"/>\u003ccircle class=\"st\" cx=\"214.73\" cy=\"56.36\" r=\"11\"/>\u003ctext class=\"lbl\" x=\"214.73\" y=\"60.36\" text-anchor=\"middle\" style=\"fill:var(--fg)\">1\u003c/text>\u003ccircle class=\"fp\" cx=\"228.24\" cy=\"115.58\" r=\"11\"/>\u003ccircle class=\"st\" cx=\"228.24\" cy=\"115.58\" r=\"11\"/>\u003ctext class=\"lbl\" x=\"228.24\" y=\"119.58\" text-anchor=\"middle\" style=\"fill:var(--fg)\">2\u003c/text>\u003ccircle class=\"fp\" cx=\"190.37\" cy=\"163.07\" r=\"11\"/>\u003ccircle class=\"st\" cx=\"190.37\" cy=\"163.07\" r=\"11\"/>\u003ctext class=\"lbl\" x=\"190.37\" y=\"167.07\" text-anchor=\"middle\" style=\"fill:var(--fg)\">3\u003c/text>\u003ccircle class=\"fp\" cx=\"129.63\" cy=\"163.07\" r=\"11\"/>\ Math.min(1, (now - t0) / dur) : 1, e = u \u003c .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;\n      if (m.t === 'b') { const a = a0 + e * 2 * Math.PI / M; place(0, [R * Math.cos(a), R * Math.sin(a)]); }\n      else place(0, [x0 + (x1 - x0) * e, y0 + (y1 - y0) * e]);\n      if (u \u003c 1) requestAnimationFrame(tick); else { pos = m.to; place(pos); done(); }\n    };\n    requestAnimationFrame(tick);\n  }\n  let busy = false;\n  function step(cb) {\n    if (busy || k >= moves.length) { cb && cb(false); return; }\n    const m = moves[k++], s = document.getElementById('num').value.replace(/\\D/g, '') || '0';\n    if (m.t === 'mark') { render(s, -1, m.idx); document.getElementById('now').textContent = 'After \"' + m.prefix + '\" you are on ' + (m.st === 0 ? 'YES' : m.st) + ': ' + m.prefix + ' leaves remainder ' + m.st + ' when divided by ' + M + '.'; cb && cb(true); return; }\n    if (m.t === 'end') { const ok = m.st === 0; document.getElementById('result').textContent = ok ? m.s + ' is divisible by ' + M + '. You ended on YES.' : m.s + ' is not divisible by ' + M + ': it leaves remainder ' + m.st + '.'; cb && cb(false); return; }\n    render(s, m.idx); busy = true; animate(m, () => { busy = false; cb && cb(true); });\n  }\n  function play() { clearTimeout(timer); const go = () => step(more => { if (more) timer = setTimeout(go, reduce ? 0 : 60); }); go(); }\n  document.getElementById('play').onclick = () => { plan(); play(); };\n  document.getElementById('step').onclick = () => { if (k === 0 || k >= moves.length) plan(); step(); };\n  document.getElementById('rand').onclick = () => { document.getElementById('num').value = String(Math.floor(Math.random() * 90000) + 100); plan(); };\n  document.getElementById('num').addEventListener('input', () => { clearTimeout(timer); plan(); });\n  sel.onchange = () => { M = +sel.value; clearTimeout(timer); plan(); };\n  plan();\n})();\n\u003c/script>\n","date":1795088999082,"order":3}],"publishedAt":1795109389844}</script>

function siteDirty() {
  const at = PUB.publishedAt || 0;
  if (S.siteSavedAt > at + 1000) return 'Site settings changed since the last publish.';
  const live = new Set((PUB.pieces || []).map(p => p.title));
  const pubs = S.drafts.filter(d => d.status === 'published');
  if (pubs.some(d => (d.updatedAt || 0) > at + 1000)) return 'Published pieces have edits that are not live yet.';
  if (pubs.length !== (PUB.pieces || []).length || pubs.some(d => !live.has(d.title))) return 'The live site has a different set of pieces.';
  return '';
}

/* ================= Studio: Claude ================= */
function genPrompt(d, appr, extra, base) {
  const site = S.site;
  const rules = [
    'You design ONE self-contained interactive explainer for a public website called "' + site.title + '" (' + site.tagline + '). Each page shows a real-world object or trick and reveals the maths or geometry hidden inside it.',
    'OUTPUT: only one ```html code block holding an HTML FRAGMENT (no <html>, <head> or <body> tags) with its own <style> and <script> inline. Nothing before or after the block.',
    'It is injected into a page that already defines CSS variables: --bg, --panel (the frame background), --fg, --muted, --accent, --accent2 (highlight), --line, --on-accent (text on accent), --radius, and fonts --font-display, --font-body, --font-ui, --font-mono. Use ONLY these for colours and fonts. On canvas, read them with getComputedStyle(document.documentElement).getPropertyValue("--fg").trim(); they are 6-digit hex. Ready-made helpers: buttons are already styled (aria-pressed="true" or class hg-primary shows the accent), .hg-seg (button group), .hg-row (flex row), .hg-caption (small mono caption).',
    'Hard limits: no external files, images, fonts, libraries or network calls; no iframes; no alert/confirm/prompt; no localStorage. Draw with SVG or canvas from real maths so it is correct, not approximate decoration. Wrap your code in an IIFE and scope CSS under one wrapper class.',
    'Layout: must work from 330px to 900px wide, no horizontal scroll, padding 16px, canvases scale with width (CSS width:100%, height:auto). Give it at least one thing the reader directly manipulates. Respect prefers-reduced-motion. Keep visible text short and in plain English; captions should update as the reader interacts so they always explain what is on screen. Keep it under about 22 KB.',
    'House style: ' + S.studio.houseStyle,
  ].join('\n');
  const about = [
    'THE PIECE',
    'Title: ' + (d.title || ''),
    d.foundAt ? 'Where I found it: ' + d.foundAt : '',
    d.hook ? 'Hook: ' + d.hook : '',
    d.notes ? 'My notes:\n' + d.notes : '',
    d.story ? 'Story text already on the page (do not repeat it at length):\n' + d.story : '',
    (d.sources || []).length ? 'Sources: ' + d.sources.map(s => s.label + (s.url ? ' ' + s.url : '')).join('; ') : '',
  ].filter(Boolean).join('\n');
  if (base) return rules + '\n\n' + about + '\n\nHERE IS THE CURRENT VERSION:\n```html\n' + base + '\n```\n\nCHANGE REQUEST: ' + extra + '\n\nReturn the complete revised fragment.';
  return rules + '\n\n' + about + '\n\nAPPROACH: ' + appr.name + ' — ' + appr.brief + (extra ? '\n\nExtra direction from me: ' + extra : '');
}
function extractHtml(text) {
  const m = /```(?:html)?\s*\n([\s\S]*?)```/i.exec(text);
  if (m) return m[1].trim();
  const i = text.indexOf('<'); return i >= 0 ? text.slice(i).trim() : '';
}
async function generate(approachIds, extra) {
  const d = S.drafts.find(x => x.id === S.current); if (!d || !S.sample) return;
  const list = S.studio.approaches.filter(a => approachIds.includes(a.id));
  if (!list.length) { toast('Pick at least one approach.'); return; }
  if (d.status === 'idea') saveDraft(d.id, { status: 'drafting' }, 0);
  await Promise.allSettled(list.map(a => runSample(d, genPrompt(d, a, extra), { approach: a.name, instructions: extra || '' })));
}
async function refine(base, request) {
  const d = S.drafts.find(x => x.id === S.current); if (!d || !S.sample || !request.trim()) return;
  await runSample(d, genPrompt(d, null, request, base.html), { approach: base.approach.replace(/ · refined.*$/, '') + ' · refined', instructions: request, parent: base.id });
}

    const res = await S.sample(prompt, { modelTier: S.studio.modelTier, cache: false, signal: ctl.signal, onText: ({ text }) => { const g = S.generating[key]; if (g) { g.text = text; updateStream(key); } } });
    const html = extractHtml(res.text);
    if (!html) throw { code: 'no_html', message: 'Claude did not return any HTML.' };
    const ref = await S.db.collection('drafts/' + d.id + '/variants').add(Object.assign({}, meta, { html, createdAt: Date.now(), tier: res.modelTierApplied || S.studio.modelTier }));

}
